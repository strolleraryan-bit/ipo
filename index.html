<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lot & Ledger — IPO Manager</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a0a0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lot & Ledger">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0b;
    --bg-elev:#141416;
    --bg-elev-2:#1c1c1f;
    --border:#28282c;
    --border-soft:#1e1e21;
    --text:#ededec;
    --text-dim:#8f8f95;
    --text-faint:#5c5c62;
    --gold:#d4a656;
    --gold-dim:#8a7343;
    --profit:#5fd188;
    --loss:#f0685f;
    --pending:#7a7a82;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:78px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--gold); color:#0a0a0b;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(10,10,11,0.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:18px 20px 14px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:30px; height:30px; border-radius:8px;
    background:linear-gradient(155deg, var(--gold), var(--gold-dim));
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Grotesk',sans-serif; font-weight:700; color:#0a0a0b; font-size:15px;
    flex-shrink:0;
  }
  .brand h1{font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0; font-weight:600; letter-spacing:0.2px;}
  .brand .sub{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .page-title{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin:2px 0 4px;}
  .page-sub{font-size:12.5px; color:var(--text-dim); margin-bottom:0;}

  main{max-width:640px; margin:0 auto; padding:18px 16px 20px;}

  /* Bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(15,15,17,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border-soft);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-faint);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 2px; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:500;
    cursor:pointer; border-radius:10px; transition:color .15s;
  }
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar svg{width:20px; height:20px;}

  /* Cards */
  .card{
    background:var(--bg-elev); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
  }
  .card-tight{padding:14px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat{
    background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
    padding:13px 14px;
  }
  .stat .label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;}
  .stat .value{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat .value.profit{color:var(--profit);}
  .stat .value.loss{color:var(--loss);}
  .stat .value.gold{color:var(--gold);}

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-faint);
    margin:20px 2px 10px; font-weight:600;
  }
  .section-label:first-child{margin-top:0;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .list-item{
    background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:14px 15px; margin-bottom:9px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .list-item:active{background:var(--bg-elev-2);}
  .list-item .title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .list-item .meta{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
  .list-item .right{text-align:right;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600;
    padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:0.4px;
    border:1px solid var(--border);
  }
  .badge .dot{width:6px; height:6px; border-radius:50%;}
  .badge.upcoming{color:#8fa3d4;} .badge.upcoming .dot{background:#8fa3d4;}
  .badge.open{color:var(--gold);} .badge.open .dot{background:var(--gold);}
  .badge.pending{color:var(--pending);} .badge.pending .dot{background:var(--pending);}
  .badge.allotted{color:#7fb9e8;} .badge.allotted .dot{background:#7fb9e8;}
  .badge.listed{color:var(--profit);} .badge.listed .dot{background:var(--profit);}

  .empty{
    text-align:center; padding:44px 20px; color:var(--text-faint);
  }
  .empty .icon{font-size:30px; margin-bottom:10px; opacity:0.5;}
  .empty .msg{font-size:13px; line-height:1.5;}

  /* Buttons */
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    border-radius:11px; padding:12px 18px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .1s, opacity .15s; width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold); color:#0a0a0b;}
  .btn-secondary{background:var(--bg-elev-2); color:var(--text); border:1px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border-soft);}
  .btn-danger{background:transparent; color:var(--loss); border:1px solid rgba(240,104,95,0.3);}
  .btn-sm{padding:8px 12px; font-size:12.5px; width:auto;}
  .fab{
    position:fixed; right:18px; bottom:88px; z-index:25;
    width:52px; height:52px; border-radius:16px; background:var(--gold); color:#0a0a0b;
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(212,166,86,0.28); cursor:pointer; line-height:0;
  }

  /* Forms */
  label{display:block; font-size:11.5px; color:var(--text-dim); margin:14px 0 6px; font-weight:500;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:11px 13px; font-size:14.5px;
    font-family:'Inter',sans-serif; outline:none;
  }
  input.mono, .mono-input{font-family:'JetBrains Mono',monospace;}
  input:focus, select:focus, textarea:focus{border-color:var(--gold-dim);}
  input[type=date]{color-scheme:dark;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .helptext{font-size:11px; color:var(--text-faint); margin-top:5px;}
  .toggle-row{display:flex; gap:8px; margin-top:0;}
  .toggle-btn{
    flex:1; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .toggle-btn.active{background:rgba(212,166,86,0.14); border-color:var(--gold-dim); color:var(--gold);}
  .chip-list{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .chip{
    background:var(--bg-elev-2); border:1px solid var(--border); border-radius:99px;
    padding:6px 10px 6px 12px; font-size:12px; display:flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono',monospace;
  }
  .chip .x{cursor:pointer; color:var(--text-faint); font-size:14px;}
  .date-add-row{display:flex; gap:8px;}
  .date-add-row input{flex:1;}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px);
    z-index:50; display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg-elev); border:1px solid var(--border); border-top-left-radius:20px; border-top-right-radius:20px;
    width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:8px 18px 22px;
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:10px auto 14px;}
  .modal-title{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin-bottom:4px;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}

  /* Tables */
  .tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
  .tbl th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-faint); font-weight:600; padding:0 8px 8px 0; border-bottom:1px solid var(--border-soft);
  }
  .tbl td{padding:9px 8px 9px 0; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .app-row{background:var(--bg-elev-2); border-radius:12px; padding:13px 14px; margin-bottom:9px; border:1px solid var(--border-soft);}
  .app-row .name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;}
  .app-row .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-top:10px; font-size:12px;}
  .app-row .grid .k{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;}
  .app-row .grid .v{font-family:'JetBrains Mono',monospace; margin-top:2px;}
  .app-row .actions{display:flex; gap:8px; margin-top:12px;}

  .divider{height:1px; background:var(--border-soft); margin:14px 0;}
  .tab-strip{display:flex; gap:6px; margin-bottom:16px; background:var(--bg-elev); padding:4px; border-radius:12px; border:1px solid var(--border-soft);}
  .tab-strip button{
    flex:1; background:none; border:none; color:var(--text-dim); font-size:12.5px; font-weight:600;
    padding:9px 4px; border-radius:9px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .tab-strip button.active{background:var(--bg-elev-2); color:var(--gold);}

  .avatar{
    width:38px; height:38px; border-radius:10px; background:var(--bg-elev-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:14px; color:var(--gold); flex-shrink:0;
  }
  .txn-item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border-soft);}
  .txn-item:last-child{border-bottom:none;}
  .txn-dot{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .txn-dot.out{background:rgba(240,104,95,0.12); color:var(--loss);}
  .txn-dot.in{background:rgba(95,209,136,0.12); color:var(--profit);}
  .toast{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); font-size:12.5px;
    padding:10px 16px; border-radius:99px; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .install-note{font-size:11px; color:var(--text-faint); line-height:1.5; padding:12px 14px; background:var(--bg-elev); border:1px dashed var(--border); border-radius:12px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">L</div>
    <div>
      <h1>Lot &amp; Ledger</h1>
      <div class="sub" id="headerSub">IPO applications, allotments &amp; settlements</div>
    </div>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab" style="display:none;">+</button>

<nav class="tabbar">
  <button data-tab="dashboard" class="tab-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l2-2 4 4 8-8 4 4"/><path d="M3 20h18" stroke-opacity="0.4"/></svg>
    Dashboard
  </button>
  <button data-tab="ipos" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v0"/></svg>
    IPOs
  </button>
  <button data-tab="users" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 8.5a3 3 0 110 5.9M21.5 20c0-2.9-1.9-5.1-4.5-5.8"/></svg>
    Users
  </button>
  <button data-tab="reports" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h8l4 4v14a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>
    Reports
  </button>
</nav>

<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* ============================= STATE ============================= */
let state = { users: [], ipos: [], applications: [], transactions: [] };
let ready = false;
let activeTab = 'dashboard';
let ipoDetailId = null;
let userDetailId = null;
let ipoDetailSubTab = 'apps';
let ipoSearchQuery = '';
let ipoStatusFilter = 'active';
let userSearchQuery = '';
let editingTxnId = null;

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0; n = Math.abs(n);
  const s = n.toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'-':'') + '₹' + s;
};
const fmtDate = iso => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDateShort = iso => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); };
const clamp0 = n => Math.max(0, n||0);

/* ============================= STORAGE ============================= */
async function loadState(){
  try{
    const res = await window.storage.get('app-state', false);
    if(res && res.value){ state = JSON.parse(res.value); }
  }catch(e){ /* no data yet */ }
  if(!state.users.some(u=>u.isMe)){
    state.users.unshift({id:uid(), name:'Me', isMe:true, defaultCommission:25, openingBalance:0});
  }
  state.users.forEach(u=>{ if(u.openingBalance==null) u.openingBalance = 0; });
  // Migrate old transaction schema {userId, type:'given'|'received'} to {fromUserId, toUserId}
  const me = state.users.find(u=>u.isMe);
  state.transactions = (state.transactions||[]).map(t=>{
    if(t.fromUserId!=null && t.toUserId!=null) return t;
    if(t.type==='given') return {id:t.id, date:t.date, note:t.note, amount:t.amount, fromUserId: me?me.id:null, toUserId:t.userId};
    if(t.type==='received') return {id:t.id, date:t.date, note:t.note, amount:t.amount, fromUserId:t.userId, toUserId: me?me.id:null};
    return t;
  }).filter(t=>t.fromUserId && t.toUserId);
  ready = true;
  render();
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{ await window.storage.set('app-state', JSON.stringify(state), false); }
    catch(e){ showToast('Save failed — changes kept locally this session'); }
  }, 120);
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `lot-and-ledger-backup-${todayISO()}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    showToast('Backup downloaded');
  }catch(e){ showToast('Export failed'); }
}
document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    if(!parsed || !Array.isArray(parsed.users) || !Array.isArray(parsed.ipos)){
      showToast('Not a valid backup file'); return;
    }
    if(!confirm('Import this backup? It will replace all current data in the app.')) return;
    state = {
      users: parsed.users||[], ipos: parsed.ipos||[],
      applications: parsed.applications||[], transactions: parsed.transactions||[]
    };
    if(!state.users.some(u=>u.isMe)) state.users.unshift({id:uid(), name:'Me', isMe:true, defaultCommission:25});
    saveState(); render(); showToast('Backup imported');
  }catch(err){ showToast('Could not read that file'); }
});

/* ============================= CALCULATIONS ============================= */
function ipoStatus(ipo){
  const t = todayISO();
  const dates = (ipo.biddingDates||[]).slice().sort();
  if(dates.length){
    if(t < dates[0]) return 'upcoming';
    if(t <= dates[dates.length-1]) return 'open';
  }
  if(ipo.allotmentDate && t < ipo.allotmentDate) return 'pending';
  if(ipo.listingDate && t < ipo.listingDate) return 'allotted';
  if(ipo.listingDate && t >= ipo.listingDate) return 'listed';
  return 'pending';
}
const STATUS_LABEL = {upcoming:'Upcoming', open:'Bidding Open', pending:'Allotment Pending', allotted:'Allotted · Awaiting Listing', listed:'Listed'};

function totalCost(app, ipo){ return (app.lots||0) * (ipo.lotSize||0) * (ipo.pricePerShare||0); }

// Expected profit per share/lot based on GMP (Grey Market Premium) entered manually for the IPO.
// This is a projection only, distinct from computeApp()'s actual realized profit after sale.
function expectedProfitPerShare(ipo){ return ipo.gmp!=null ? ipo.gmp : null; }
function expectedProfitPerLot(ipo){ const gmp = expectedProfitPerShare(ipo); return gmp!=null ? gmp*(ipo.lotSize||0) : null; }
function expectedProfitForApp(app, ipo){
  const gmp = expectedProfitPerShare(ipo);
  if(gmp==null) return null;
  const lots = (app.lotsAllotted!=null? app.lotsAllotted : app.lots) || 0;
  return gmp * lots * (ipo.lotSize||0);
}
function expectedProfitForIpo(ipo){
  const gmp = expectedProfitPerShare(ipo);
  if(gmp==null) return null;
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);
  return apps.reduce((sum,a)=> sum + (expectedProfitForApp(a, ipo)||0), 0);
}
function lastApplyDate(ipo){
  const dates = (ipo.biddingDates||[]).slice().sort();
  return dates.length ? dates[dates.length-1] : null;
}

// Determine funding source: 'me' (100% my fund), 'shared' (both), 'own' (100% user's own fund, I have zero stake)
function fundingSourceOf(app, ipo){
  if(app.fundingSource) return app.fundingSource;
  // Backward-compat inference for records saved before fundingSource existed
  const cost = totalCost(app, ipo);
  const funded = app.fundedByMe||0;
  if(funded <= 0.0001) return 'own';
  if(funded >= cost - 0.0001) return 'me';
  return 'shared';
}

// Full settlement computation for a single application
function computeApp(app, ipo, user){
  const fullCost = totalCost(app, ipo);
  const isMe = user && user.isMe;
  const source = isMe ? 'me' : fundingSourceOf(app, ipo);
  const out = {
    fullCost, isMe, fundingSource: source,
    status: 'pending', // pending | refunded | holding | settled
    X: 0, nEff: 0, sEff: 0, unallottedRefund: 0,
    proceeds: null, profit: null, commission: 0, myProfitShare: null, friendShare: null,
    owedToMe: 0
  };
  if(app.allotted === false){
    out.status = 'refunded';
    out.X = 0; out.unallottedRefund = app.fundedByMe||0;
    out.owedToMe = isMe ? 0 : (app.fundedByMe||0);
    return out;
  }
  if(app.allotted !== true){
    out.status = 'pending';
    return out;
  }
  // allotted
  const lotsAllotted = (app.lotsAllotted!=null? app.lotsAllotted : app.lots) || 0;
  const X = lotsAllotted * (ipo.lotSize||0) * (ipo.pricePerShare||0);
  out.X = X;
  const funded = app.fundedByMe||0;
  const nEff = Math.min(funded, X);
  const sEff = clamp0(X - nEff);
  out.nEff = nEff; out.sEff = sEff;
  out.unallottedRefund = clamp0(funded - nEff);

  if(app.sellPrice === null || app.sellPrice === undefined || app.sellPrice === ''){
    out.status = 'holding';
    out.owedToMe = isMe ? 0 : (source==='own' ? 0 : out.unallottedRefund); // unallotted portion already refundable
    return out;
  }
  // sold
  out.status = 'settled';
  const proceeds = lotsAllotted * (ipo.lotSize||0) * app.sellPrice;
  const profit = proceeds - X;
  out.proceeds = proceeds; out.profit = profit;

  if(isMe){
    out.myProfitShare = profit;
    out.owedToMe = 0;
    return out;
  }

  if(source==='own'){
    // 100% user's own fund -> I have no money in it, no commission, no profit share
    out.myProfitShare = 0;
    out.friendShare = profit;
    out.commission = 0;
    out.owedToMe = 0;
    return out;
  } else if(source==='me'){
    // fully funded by me -> commission model, only on positive profit
    const commPct = (app.commissionPercent!=null? app.commissionPercent : (user.defaultCommission||0));
    const commission = profit > 0 ? profit * (commPct/100) : 0;
    out.commission = commission;
    out.myProfitShare = profit - commission;
    out.friendShare = commission;
  } else {
    // shared fund -> profit split by investment ratio, no commission
    const myShare = X>0 ? profit * (nEff/X) : 0;
    const friendShare = X>0 ? profit * (sEff/X) : 0;
    out.myProfitShare = myShare;
    out.friendShare = friendShare;
    out.commission = 0;
  }
  out.owedToMe = out.unallottedRefund + nEff + out.myProfitShare;
  return out;
}

function transfersWithMe(userId){
  const me = state.users.find(u=>u.isMe);
  let given=0, received=0;
  if(!me) return {given, received};
  state.transactions.forEach(t=>{
    if(t.fromUserId===me.id && t.toUserId===userId) given += t.amount;
    if(t.fromUserId===userId && t.toUserId===me.id) received += t.amount;
  });
  return {given, received};
}

function userBalance(userId){
  const user = state.users.find(u=>u.id===userId);
  if(!user || user.isMe) return {owed:0, given:0, received:0, net:0, opening:0};
  let owed = 0;
  state.applications.filter(a=>a.userId===userId).forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const c = computeApp(a, ipo, user);
    if(c.status==='refunded' || c.status==='settled') owed += c.owedToMe;
  });
  const {given, received} = transfersWithMe(userId);
  const opening = user.openingBalance||0;
  const net = opening + owed + given - received; // positive => they owe me
  return {owed, given, received, net, opening};
}

function myTotals(){
  let deployed = 0, profitMine = 0, commissionEarnedByFriends = 0, outstanding = 0;
  state.applications.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const user = state.users.find(u=>u.id===a.userId); if(!user) return;
    const c = computeApp(a, ipo, user);
    if(c.status==='holding' || c.status==='pending') deployed += (a.fundedByMe||0);
    if(user.isMe && c.status==='settled') profitMine += (c.profit||0);
    if(!user.isMe && c.status==='settled'){ profitMine += (c.myProfitShare||0); commissionEarnedByFriends += (c.commission||0); }
  });
  state.users.filter(u=>!u.isMe).forEach(u=>{ outstanding += userBalance(u.id).net; });

  // IPO-level counts
  const activeIpos = state.ipos.filter(i=>!i.archived);
  const totalIpos = state.ipos.length;
  const allottedIpos = state.ipos.filter(i=>{
    const apps = state.applications.filter(a=>a.ipoId===i.id);
    return apps.length>0 && apps.some(a=>a.allotted===true);
  }).length;

  // Fund given / returned — from the funding & repayment (money transfer) ledger, Me -> Users vs Users -> Me
  const me = state.users.find(u=>u.isMe);
  let fundGiven = 0, fundReturned = 0;
  if(me){
    state.transactions.forEach(t=>{
      if(t.fromUserId===me.id && t.toUserId!==me.id) fundGiven += t.amount;
      if(t.toUserId===me.id && t.fromUserId!==me.id) fundReturned += t.amount;
    });
  }

  return {deployed, profitMine, commissionEarnedByFriends, outstanding,
    totalIpos, activeIpos: activeIpos.length, allottedIpos, fundGiven, fundReturned};
}

// My Account = my opening balance + my total profit earned (own IPOs + share from friends')
function myAccountBalance(){
  const me = state.users.find(u=>u.isMe);
  const opening = me? (me.openingBalance||0) : 0;
  return opening + myTotals().profitMine;
}

// Total value sitting in friends' accounts = opening balance + fund I've given them (historical) + their own earned profit/commission
function totalInOthersAccounts(){
  let total = 0;
  state.users.filter(u=>!u.isMe).forEach(u=>{
    let fundGiven = 0, theirProfit = 0;
    state.applications.filter(a=>a.userId===u.id).forEach(a=>{
      const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
      fundGiven += a.fundedByMe||0; // 0 for 'own' fund apps automatically
      const c = computeApp(a, ipo, u);
      if(c.status==='settled') theirProfit += (c.friendShare||0);
    });
    total += (u.openingBalance||0) + fundGiven + theirProfit;
  });
  return total;
}

function nextKeyDate(ipo){
  const t = todayISO();
  const candidates = [];
  (ipo.biddingDates||[]).forEach(d=>{ if(d>=t) candidates.push({date:d, label:'Bidding'}); });
  if(ipo.allotmentDate && ipo.allotmentDate>=t) candidates.push({date:ipo.allotmentDate, label:'Allotment'});
  if(ipo.listingDate && ipo.listingDate>=t) candidates.push({date:ipo.listingDate, label:'Listing'});
  candidates.sort((a,b)=>a.date.localeCompare(b.date));
  return candidates[0];
}
function statusBadge(ipo){
  if(ipo.archived) return `<span class="badge pending"><span class="dot"></span>Archived</span>`;
  const s = ipoStatus(ipo);
  let extra = '';
  if(s==='open'){
    const dates = (ipo.biddingDates||[]).slice().sort();
    const last = dates[dates.length-1];
    if(last){
      const days = Math.round((new Date(last+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
      if(days===0) extra = ' · Closes today';
      else if(days>0) extra = ` · ${days}d left`;
    }
  }
  return `<span class="badge ${s}"><span class="dot"></span>${STATUS_LABEL[s]}${extra}</span>`;
}
function emptyBlock(title, msg){
  return `<div class="empty"><div class="icon">◇</div><div class="msg"><strong style="color:var(--text-dim)">${title}</strong><br>${msg}</div></div>`;
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

    else if(c.status==='settled') statusChip = `<span class="badge listed"><span class="dot"></span>Sold</span>`;
    else statusChip = `<span class="badge upcoming"><span class="dot"></span>Awaiting Result</span>`;

    const srcLabel = {me:'100% My Fund', shared:'Shared Fund', own:"User's Own Fund"}[c.fundingSource] || '';
    return `<div class="app-row">
      <div class="row">
        <div class="row" style="gap:9px;">

          </div>
        </div>
        ${statusChip}
      </div>
      <div class="grid">
        <div><div class="k">Applied Amount</div><div class="v">${fmtMoney(cost)}</div></div>
        <div><div class="k">My Investment</div><div class="v">${fmtMoney(a.fundedByMe||0)}</div></div>

        ${c.status==='settled' ? `<div><div class="k">Selling Price</div><div class="v">${fmtMoney(a.sellPrice)}</div></div>` : ''}
        ${c.status==='settled' ? `<div><div class="k">Sale Amount</div><div class="v">${fmtMoney(c.proceeds)}</div></div>` : ''}
        ${c.status==='settled' ? `<div><div class="k">Profit / Loss</div><div class="v ${c.profit>=0?'profit':'loss'}">${fmtMoney(c.profit)}</div></div>` : ''}
        ${c.status==='settled' && !user.isMe && c.fundingSource!=='own' ? `<div><div class="k">Owed to Me</div><div class="v gold">${fmtMoney(c.owedToMe)}</div></div>` : ''}
        ${c.status==='refunded' && !user.isMe && c.fundingSource!=='own' ? `<div><div class="k">Owed to Me</div><div class="v gold">${fmtMoney(c.owedToMe)}</div></div>` : ''}
      </div>
      <div class="actions">
        ${a.allotted==null ? `
          <button class="btn btn-secondary btn-sm" style="flex:1;" onclick="setAllotment('${a.id}', true)">Mark Allotted</button>
          <button class="btn btn-danger btn-sm" style="flex:1;" onclick="setAllotment('${a.id}', false)">Not Allotted</button>
        ` : ''}
        ${a.allotted===true && c.status==='holding' && isListingDay ? `<button class="btn btn-primary btn-sm" style="flex:1;" onclick="promptSellPrice('${a.id}')">Enter Sell Price</button>` : ''}

      </div>
    </div>`;
  }).join('');
}

function renderIpoSummary(ipo, apps, totalProfit, totalCommission){
  const allotted = apps.filter(a=>a.allotted===true).length;
  const notAllotted = apps.filter(a=>a.allotted===false).length;
  const pending = apps.filter(a=>a.allotted==null).length;
  // Only count capital still deployed (not yet refunded from a rejected application)
  const totalDeployed = apps.filter(a=>a.allotted!==false).reduce((s,a)=>s+(a.fundedByMe||0),0);
  return `
    <div class="stat-grid">
      <div class="stat"><div class="label">Allotted</div><div class="value">${allotted}</div></div>
      <div class="stat"><div class="label">Not Allotted</div><div class="value">${notAllotted}</div></div>
      <div class="stat"><div class="label">Awaiting Result</div><div class="value">${pending}</div></div>
      <div class="stat"><div class="label">Capital I Put In</div><div class="value gold">${fmtMoney(totalDeployed)}</div></div>
      <div class="stat"><div class="label">Total Profit (Mine)</div><div class="value ${totalProfit>=0?'profit':'loss'}">${fmtMoney(totalProfit)}</div></div>
      <div class="stat"><div class="label">Commission Paid</div><div class="value">${fmtMoney(totalCommission)}</div></div>
    </div>
  `;
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function setAllotment(appId, allotted){

function csvCell(v){
  const s = (v===null||v===undefined)? '' : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(rows, filename){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('CSV downloaded');
}
function exportIpoReportCSV(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo) return;
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);
  const rows = [['Applicant','Lots','Status','Sell Price','Profit/Loss','Owed to Me']];
  apps.forEach(a=>{
    const u = state.users.find(x=>x.id===a.userId); if(!u) return;
    const c = computeApp(a, ipo, u);
    rows.push([u.name, a.lots, c.status, a.sellPrice||'', c.profit!=null?Math.round(c.profit):'', u.isMe?'':Math.round(c.owedToMe)]);
  });
  downloadCSV(rows, `${ipo.name.replace(/[^a-z0-9]+/gi,'-')}-report.csv`);
}
function exportUserReportCSV(userId){
  const u = state.users.find(x=>x.id===userId); if(!u) return;
  const apps = state.applications.filter(a=>a.userId===userId);
  const rows = [['IPO','Lots','Status','Sell Price','Profit/Loss','Owed to Me']];
  apps.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const c = computeApp(a, ipo, u);
    rows.push([ipo.name, a.lots, c.status, a.sellPrice||'', c.profit!=null?Math.round(c.profit):'', u.isMe?'':Math.round(c.owedToMe)]);
  });
  downloadCSV(rows, `${u.name.replace(/[^a-z0-9]+/gi,'-')}-statement.csv`);
}

/* ============================= PDF EXPORTS ============================= */
const PDF_GOLD = [212,166,86];
const PDF_DARK = [20,20,22];
const PDF_TEXT = [40,40,42];
const PDF_DIM = [120,120,126];
const PDF_PROFIT = [30,140,80];
const PDF_LOSS = [200,60,55];

function pdfDoc(){
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit:'pt', format:'a4' });
}

function pdfHeader(doc, title, subtitle){
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(...PDF_DARK);
  doc.rect(0, 0, pageWidth, 64, 'F');
  doc.setTextColor(...PDF_GOLD);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('Lot & Ledger', 36, 28);
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(10);
  doc.text(title, 36, 46);
  doc.setTextColor(200,200,205);
  doc.setFontSize(8);
  doc.text(subtitle || `Generated ${fmtDate(todayISO())}`, 36, 58);
  doc.setTextColor(...PDF_TEXT);
  return 84;
}

function pdfFooter(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(...PDF_DIM);
    doc.text(`Lot & Ledger — Page ${i} of ${pageCount}`, 36, pageHeight-20);
    doc.text(fmtDate(todayISO()), pageWidth-36, pageHeight-20, {align:'right'});
  }
}

function statusLabelFor(c){
  return c.status==='refunded' ? 'Not Allotted'
    : c.status==='holding' ? 'Allotted (Holding)'
    : c.status==='settled' ? 'Allotted (Sold)'
    : 'Awaiting Result';
}

function downloadPDF(doc, filename){
  try{
    doc.save(filename);
    showToast('PDF downloaded');
  }catch(e){ showToast('PDF export failed'); }
}

/* --- Single IPO Report PDF: applied / not applied / allotted / profit per allotment / total profit --- */
function exportIpoReportPDF(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo) return;
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);

/* ============================= IMAGE EXPORT ============================= */
function exportIpoDetailsImage(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo){ showToast('IPO not found'); return; }

  const dpr = window.devicePixelRatio || 1;
  const W = 720, PAD = 36;
  const GOLD = '#d4a656', PROFIT = '#5fd188', LOSS = '#f0685f', DIM = '#8f8f95', FAINT = '#5c5c62';
  const BG = '#0a0a0b', BG2 = '#141416', BG3 = '#1c1c1f', BORDER = '#28282c', TEXT = '#ededec';

  const expPerShare = expectedProfitPerShare(ipo);
  const expPerLot = expectedProfitPerLot(ipo);
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);

  // Compute rows
  const rows = [
    ['Price / Share', fmtMoney(ipo.pricePerShare)],
    ['Lot Size', String(ipo.lotSize||0)],
    ['Cost / Lot', fmtMoney((ipo.lotSize||0)*(ipo.pricePerShare||0))],
    ['GMP / Share', ipo.gmp!=null ? (ipo.gmp>=0?'+':'')+fmtMoney(ipo.gmp) : '—'],
    ['Expected Profit / Lot', expPerLot!=null ? fmtMoney(expPerLot) : '—'],
    ['Last Date to Apply', fmtDate(lastApplyDate(ipo))],
    ['Allotment Date', fmtDate(ipo.allotmentDate)],
    ['Listing Date', fmtDate(ipo.listingDate)],
  ];
  if(ipo.listingPrice!=null) rows.push(['Listing Price', fmtMoney(ipo.listingPrice)]);

  const appRows = apps.map(a=>{
    const u = state.users.find(x=>x.id===a.userId); if(!u) return null;
    const exp = expectedProfitForApp(a, ipo);
    return [u.name+(u.isMe?' (You)':''), String(a.lots)+' lot'+(a.lots!==1?'s':''), exp!=null?fmtMoney(exp):'—'];
  }).filter(Boolean);

  const ROW_H = 38, HEADER_H = 70, TITLE_BLOCK = 88, SECTION_GAP = 20;
  let estimatedH = HEADER_H + TITLE_BLOCK + rows.length * ROW_H + SECTION_GAP;
  if(appRows.length) estimatedH += 36 + appRows.length * ROW_H + SECTION_GAP;
  if(ipo.notes) estimatedH += 48 + 26;
  estimatedH += 50; // footer + bottom padding

  const canvas = document.createElement('canvas');
  canvas.width = W * dpr; canvas.height = estimatedH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);

  // BG
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, estimatedH);

  // Header bar
  ctx.fillStyle = BG2;
  roundRect(ctx, 0, 0, W, HEADER_H, 0);
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 15px Inter, sans-serif';
  ctx.fillText('Lot & Ledger', PAD, 30);
  ctx.fillStyle = TEXT;
  ctx.font = '12px Inter, sans-serif';
  ctx.fillText('IPO Details', PAD, 50);
  ctx.fillStyle = DIM;
  ctx.font = '10px Inter, sans-serif';
  ctx.fillText(`Generated ${fmtDate(todayISO())}`, PAD, 64);

  let y = HEADER_H + 24;

  // IPO name + status
  ctx.fillStyle = TEXT;
  ctx.font = 'bold 22px Inter, sans-serif';
  ctx.fillText(ipo.name, PAD, y); y += 28;
  const st = ipoStatus(ipo);
  const stLabel = STATUS_LABEL[st] || st;
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 11px Inter, sans-serif';
  ctx.fillText('● ' + stLabel.toUpperCase(), PAD, y); y += 28;

  // Divider
  divLine(ctx, PAD, y, W-PAD, BORDER); y += 18;

  // Detail rows
  rows.forEach(([k, v], i)=>{
    const rowY = y + i * ROW_H;
    if(i%2===1){ ctx.fillStyle = BG3; roundRect(ctx, PAD-8, rowY-18, W-PAD*2+16, ROW_H, 6); }
    ctx.fillStyle = FAINT;
    ctx.font = '10px Inter, sans-serif';
    ctx.fillText(k.toUpperCase(), PAD, rowY);
    // color for GMP / expected profit
    let valColor = TEXT;
    if(k.includes('GMP') || k.includes('Expected')){ valColor = expPerShare!=null ? (expPerShare>=0? PROFIT : LOSS) : DIM; }
    ctx.fillStyle = valColor;
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(v, W-PAD, rowY+14);
    ctx.textAlign = 'left';
  });
  y += rows.length * ROW_H + SECTION_GAP;

  // Applicants section
  if(appRows.length){
    divLine(ctx, PAD, y, W-PAD, BORDER); y += 20;
    ctx.fillStyle = FAINT;
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.fillText('EXPECTED PROFIT BY APPLICANT', PAD, y); y += 20;
    appRows.forEach(([name, lots, exp], i)=>{
      const rowY = y + i * ROW_H;
      if(i%2===0){ ctx.fillStyle = BG3; roundRect(ctx, PAD-8, rowY-16, W-PAD*2+16, ROW_H, 6); }
      ctx.fillStyle = TEXT;
      ctx.font = '13px Inter, sans-serif';
      ctx.fillText(name, PAD, rowY);
      ctx.fillStyle = DIM;
      ctx.font = '11px Inter, sans-serif';
      ctx.fillText(lots, PAD, rowY+14);
      ctx.fillStyle = expPerShare!=null ? (expPerShare>=0? PROFIT : LOSS) : DIM;
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(exp, W-PAD, rowY+8);
      ctx.textAlign = 'left';
    });
    y += appRows.length * ROW_H + SECTION_GAP;
  }

  // Notes
  if(ipo.notes){
    divLine(ctx, PAD, y, W-PAD, BORDER); y += 20;
    ctx.fillStyle = FAINT;
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.fillText('NOTES', PAD, y); y += 18;
    ctx.fillStyle = DIM;
    ctx.font = '12px Inter, sans-serif';
    const noteLines = wrapText(ctx, ipo.notes, W-PAD*2);
    noteLines.forEach(l=>{ ctx.fillText(l, PAD, y); y += 18; });
    y += 8;
  }

  // Footer
  y += 12;
  divLine(ctx, PAD, y, W-PAD, BORDER); y += 16;
  ctx.fillStyle = FAINT;
  ctx.font = '10px Inter, sans-serif';
  ctx.fillText('Lot & Ledger — IPO Manager', PAD, y);
  ctx.textAlign = 'right';
  ctx.fillText(fmtDate(todayISO()), W-PAD, y);
  ctx.textAlign = 'left';

  // Trim canvas to actual height
  const finalH = y + 24;
  const outCanvas = document.createElement('canvas');
  outCanvas.width = W * dpr; outCanvas.height = finalH * dpr;
  const octx = outCanvas.getContext('2d');
  octx.drawImage(canvas, 0, 0);

  outCanvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${ipo.name.replace(/[^a-z0-9]+/gi,'-')}-details.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast('Image downloaded');
  }, 'image/png');
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath(); ctx.fill();
}
function divLine(ctx, x1, y, x2, color){
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
}
function wrapText(ctx, text, maxW){
  const words = text.split(' '); const lines = []; let line = '';
  words.forEach(w=>{ const test = line ? line+' '+w : w; if(ctx.measureText(test).width > maxW){ lines.push(line); line = w; } else line = test; });
  if(line) lines.push(line);
  return lines;
}

    <input type="text" id="f_notes" value="${ipo&&ipo.notes?esc(ipo.notes):''}" placeholder="e.g. broker used, application ref.">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveIpo('${ipoId||''}')">Save IPO</button>
    </div>
    ${ipo? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteIpo('${ipoId}')">Delete IPO</button>` : ''}
  `);
}
function renderDateChips(){
  return tempBiddingDates.slice().sort().map(d=>`<div class="chip">${fmtDateShort(d)}<span class="x" onclick="removeTempDate('${d}')">✕</span></div>`).join('');
}
function addTempDate(){
  const v = document.getElementById('f_biddate').value;
  if(!v) return;
  if(!tempBiddingDates.includes(v)) tempBiddingDates.push(v);
  document.getElementById('dateChips').innerHTML = renderDateChips();
}
function removeTempDate(d){
  tempBiddingDates = tempBiddingDates.filter(x=>x!==d);
  document.getElementById('dateChips').innerHTML = renderDateChips();
}
function saveIpo(ipoId){
  const name = document.getElementById('f_name').value.trim();
  const price = parseFloat(document.getElementById('f_price').value)||0;
  const lot = parseInt(document.getElementById('f_lot').value)||0;
  const allot = document.getElementById('f_allot').value || null;
  const listing = document.getElementById('f_listing').value || null;
  const gmpVal = document.getElementById('f_gmp').value;
  const gmp = gmpVal===''? null : parseFloat(gmpVal);
  const notes = document.getElementById('f_notes').value.trim();
  if(!name){ showToast('Please enter an IPO name'); return; }
  if(ipoId){
    const ipo = state.ipos.find(i=>i.id===ipoId);
    Object.assign(ipo, {name, pricePerShare:price, lotSize:lot, biddingDates:tempBiddingDates.slice(), allotmentDate:allot, listingDate:listing, gmp, notes});
  } else {
    state.ipos.push({id:uid(), name, pricePerShare:price, lotSize:lot, biddingDates:tempBiddingDates.slice(), allotmentDate:allot, listingDate:listing, gmp, notes, listingPrice:null, archived:false});
  }
  saveState(); closeModal(); render(); showToast('IPO saved');
}
function deleteIpo(ipoId){
  if(!confirm('Delete this IPO and all its applications? This cannot be undone.')) return;
  state.ipos = state.ipos.filter(i=>i.id!==ipoId);
  state.applications = state.applications.filter(a=>a.ipoId!==ipoId);
  saveState(); closeModal(); ipoDetailId=null; render(); showToast('IPO deleted');
}
function openListingPriceModal(ipo){
  openModal(`
    <div class="modal-title">Listing Price — ${esc(ipo.name)}</div>
    <label>Listing Price per Share</label>
    <input type="number" class="mono" id="f_lp" value="${ipo.listingPrice!=null?ipo.listingPrice:''}" placeholder="0">
    <div class="helptext">This sets the reference listing price. Each applicant's actual sell price can still be entered separately if they sold at a different price.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveListingPrice('${ipo.id}')">Save</button>
    </div>
  `);
}
function saveQuickGmp(ipoId){
  const el = document.getElementById('gmpQuickInput');
  if(!el) return;
  const v = el.value.trim();
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo) return;
  ipo.gmp = v===''? null : parseFloat(v);
  saveState(); render(); showToast('GMP updated');
}
function saveListingPrice(ipoId){
  const v = parseFloat(document.getElementById('f_lp').value);
  const ipo = state.ipos.find(i=>i.id===ipoId);
  ipo.listingPrice = isNaN(v)? null : v;
  saveState(); closeModal(); render(); showToast('Listing price saved');
}

/* --- Application modal --- */
function openAppModal(appId, ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId);
  const app = appId ? state.applications.find(a=>a.id===appId) : null;
  const usedUserIds = state.applications.filter(a=>a.ipoId===ipoId).map(a=>a.userId);
  const availableUsers = state.users.filter(u=> app? true : !usedUserIds.includes(u.id));
  if(!app && !availableUsers.length){ showToast('All users already applied to this IPO'); return; }
  const userOptions = availableUsers.map(u=>`<option value="${u.id}" ${app&&app.userId===u.id?'selected':''}>${esc(u.name)}${u.isMe?' (You)':''}</option>`).join('');

  const initSource = app ? fundingSourceOf(app, ipo) : 'me';
  openModal(`
    <div class="modal-title">${app?'Edit Applicant':'Add Applicant'}</div>
    <label>User</label>
    <select id="f_user" ${app?'disabled':''}>${userOptions}</select>
    <label>Lots Applied</label>
    <input type="number" class="mono" id="f_lots" value="${app?app.lots:1}" min="1">
    <div class="helptext" id="costPreview"></div>

    <label>Funding Source</label>
    <div class="toggle-row" id="sourceToggle">
      <button type="button" class="toggle-btn ${initSource==='me'?'active':''}" data-src="me" onclick="setFundingSourceUI('me')">100% My Fund</button>
      <button type="button" class="toggle-btn ${initSource==='shared'?'active':''}" data-src="shared" onclick="setFundingSourceUI('shared')">Shared Fund</button>
      <button type="button" class="toggle-btn ${initSource==='own'?'active':''}" data-src="own" onclick="setFundingSourceUI('own')">User's Own Fund</button>
    </div>

    <div id="investmentFields">
      <div class="field-row" style="margin-top:14px;">
        <div><label>My Investment Amount (₹)</label><input type="number" class="mono" id="f_funded" value="${app?app.fundedByMe:0}" placeholder="0"></div>
        <div><label>User Investment Amount (₹)</label><input type="number" class="mono" id="f_userinv" value="0" placeholder="0" readonly></div>
      </div>
    </div>
    <div class="helptext" id="sourceHelp"></div>

    <div id="commissionField">
      <label>Commission % (only used if 100% funded by you, on profit)</label>
      <input type="number" class="mono" id="f_comm" value="${app && app.commissionPercent!=null? app.commissionPercent : ''}" placeholder="Use user default">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveApp('${appId||''}', '${ipoId}')">Save</button>
    </div>
  `);
  let currentSource = initSource;
  const userSel = document.getElementById('f_user');
  const lotsInput = document.getElementById('f_lots');
  const fundedInput = document.getElementById('f_funded');
  const userInvInput = document.getElementById('f_userinv');
  const commWrap = document.getElementById('commissionField');
  const help = document.getElementById('sourceHelp');

  const cost = () => (parseInt(lotsInput.value)||0) * (ipo.lotSize||0) * (ipo.pricePerShare||0);

  window.setFundingSourceUI = (src)=>{
    currentSource = src;
    document.querySelectorAll('#sourceToggle .toggle-btn').forEach(b=>b.classList.toggle('active', b.dataset.src===src));
    applySourceRules();
  };

  const applySourceRules = ()=>{
    const total = cost();
    const u = state.users.find(x=>x.id===userSel.value);
    if(currentSource==='me'){
      fundedInput.value = total; fundedInput.readOnly = true;
      userInvInput.value = 0;
      commWrap.style.display = (u && u.isMe) ? 'none' : '';
      help.textContent = (u && u.isMe) ? '' : 'You fund 100%. User gets a commission % of profit; the rest is yours.';
    } else if(currentSource==='own'){
      fundedInput.value = 0; fundedInput.readOnly = true;
      userInvInput.value = total;
      commWrap.style.display = 'none';
      help.textContent = 'User funds 100% themselves. No commission, no profit share to you — this application is for tracking only.';
    } else { // shared
      fundedInput.readOnly = false;
      if(fundedInput.value==='' || parseFloat(fundedInput.value)>=total) fundedInput.value = Math.round(total/2);
      userInvInput.value = clamp0(total - (parseFloat(fundedInput.value)||0));
      commWrap.style.display = 'none';
      help.textContent = 'Both contribute. Profit is split automatically by investment ratio — no commission.';
    }
  };

  const updatePreview = ()=>{
    const total = cost();
    document.getElementById('costPreview').textContent = `Total applied amount: ${fmtMoney(total)} (${parseInt(lotsInput.value)||0} × ${ipo.lotSize||0} × ${fmtMoney(ipo.pricePerShare)})`;
    if(currentSource==='shared'){
      userInvInput.value = clamp0(total - (parseFloat(fundedInput.value)||0));
    } else {
      applySourceRules();
    }
  };
  lotsInput.addEventListener('input', updatePreview);
  fundedInput.addEventListener('input', ()=>{
    if(currentSource==='shared'){
      const total = cost();
      userInvInput.value = clamp0(total - (parseFloat(fundedInput.value)||0));
    }
  });
  if(!app){
    userSel.addEventListener('change', applySourceRules);
  }
  updatePreview();
  applySourceRules();
}
function saveApp(appId, ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId);
  const userId = document.getElementById('f_user').value;
  const lots = parseInt(document.getElementById('f_lots').value)||0;
  let funded = parseFloat(document.getElementById('f_funded').value)||0;
  const commVal = document.getElementById('f_comm').value;
  const commission = commVal===''? null : parseFloat(commVal);
  const fundingSource = (typeof currentSource!=='undefined' && currentSource) ? currentSource : 'me';
  if(!userId){ showToast('Select a user'); return; }
  if(lots<=0){ showToast('Enter number of lots'); return; }
  if(!ipo.lotSize || !ipo.pricePerShare){ showToast('Set the IPO price and lot size first'); return; }
  if(fundingSource==='own') funded = 0;
  if(appId){
    const a = state.applications.find(x=>x.id===appId);
    Object.assign(a, {lots, fundedByMe:funded, commissionPercent:commission, fundingSource});
  } else {
    state.applications.push({id:uid(), ipoId, userId, lots, fundedByMe:funded, allotted:null, lotsAllotted:null, sellPrice:null, commissionPercent:commission, fundingSource});
  }
  saveState(); closeModal(); render(); showToast('Applicant saved');
}
function openSellModal(appId, ipo){
  const a = state.applications.find(x=>x.id===appId);
  openModal(`
    <div class="modal-title">Sell Price — ${esc(ipo.name)}</div>
    <label>Actual Sell Price per Share</label>
    <input type="number" class="mono" id="f_sell" value="${ipo.listingPrice!=null?ipo.listingPrice:''}" placeholder="0">
    <div class="helptext">Defaults to the IPO listing price — edit if this applicant sold at a different price.</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveSellPrice('${appId}')">Save & Settle</button>
    </div>
  `);
}
function saveSellPrice(appId){
  const v = parseFloat(document.getElementById('f_sell').value);
  if(isNaN(v)){ showToast('Enter a valid sell price'); return; }
  const a = state.applications.find(x=>x.id===appId);
  a.sellPrice = v;
  saveState(); closeModal(); render(); showToast('Settled — profit calculated');
}

/* --- User modal --- */
function openUserModal(userId){
  const u = userId ? state.users.find(x=>x.id===userId) : null;
  openModal(`
    <div class="modal-title">${u?'Edit User':'Add User'}</div>
    <label>Name</label>
    <input type="text" id="f_uname" value="${u?esc(u.name):''}" placeholder="Friend's name" ${u&&u.isMe?'disabled':''}>
    ${!(u&&u.isMe) ? `
      <label>Default Commission % (on profit, when you fully fund their application)</label>
      <input type="number" class="mono" id="f_ucomm" value="${u&&u.defaultCommission!=null?u.defaultCommission:25}">
    ` : ''}
    <label>Opening Balance (₹)${u&&u.isMe? ' — starting profit/cash you had before using this app' : ' — what they already owed you before using this app (negative if you owed them)'}</label>
    <input type="number" class="mono" id="f_uopen" value="${u&&u.openingBalance!=null?u.openingBalance:0}">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveUser('${userId||''}')">Save</button>
    </div>
    ${u&&!u.isMe? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteUser('${userId}')">Delete User</button>`:''}
  `);
}
function saveUser(userId){
  const name = document.getElementById('f_uname').value.trim();
  const commEl = document.getElementById('f_ucomm');
  const comm = commEl ? parseFloat(commEl.value) : null;
  const opening = parseFloat(document.getElementById('f_uopen').value)||0;
  if(!name){ showToast('Enter a name'); return; }
  if(userId){
    const u = state.users.find(x=>x.id===userId);
    if(!u.isMe){ u.name = name; u.defaultCommission = isNaN(comm)?25:comm; }
    u.openingBalance = opening;
  } else {
    state.users.push({id:uid(), name, isMe:false, defaultCommission:isNaN(comm)?25:comm, openingBalance:opening});
  }
  saveState(); closeModal(); render(); showToast('User saved');
}
function deleteUser(userId){
  const bal = userBalance(userId);
  let msg = 'Delete this user? Their applications and transfers will also be removed.';
  if(Math.abs(bal.net) > 0.5){
    msg = bal.net>0
      ? `${state.users.find(u=>u.id===userId)?.name||'This user'} still owes you ${fmtMoney(bal.net)}. Deleting removes that record permanently. Continue?`
      : `You still owe ${state.users.find(u=>u.id===userId)?.name||'this user'} ${fmtMoney(-bal.net)}. Deleting removes that record permanently. Continue?`;
  }
  if(!confirm(msg)) return;
  state.users = state.users.filter(u=>u.id!==userId);
  state.applications = state.applications.filter(a=>a.userId!==userId);
  state.transactions = state.transactions.filter(t=>t.fromUserId!==userId && t.toUserId!==userId);
  saveState(); closeModal(); userDetailId=null; render(); showToast('User deleted');
}

/* --- Transaction modal (flexible: any user -> any user) --- */
function openTxnModal(defaultToUserId, txnId, prefill){
  const existing = txnId ? state.transactions.find(t=>t.id===txnId) : null;
  editingTxnId = txnId || null;
  const me = state.users.find(u=>u.isMe);
  let fromId, toId, amount = '', date = todayISO(), note = '';
  if(existing){ fromId=existing.fromUserId; toId=existing.toUserId; amount=existing.amount; date=existing.date; note=existing.note||''; }
  else if(prefill){ fromId=prefill.fromUserId; toId=prefill.toUserId; amount=prefill.amount; note=prefill.note||''; }
  else { fromId = me?me.id:''; toId = defaultToUserId || ''; }

  const opts = (selId) => state.users.map(u=>`<option value="${u.id}" ${u.id===selId?'selected':''}>${esc(u.name)}${u.isMe?' (You)':''}</option>`).join('');

  openModal(`
    <div class="modal-title">${existing? 'Edit Transfer' : 'Log Money Transfer'}</div>
    <div class="field-row">
      <div><label>From</label><select id="f_from">${opts(fromId)}</select></div>
      <div><label>To</label><select id="f_to">${opts(toId)}</select></div>
    </div>
    <button class="btn btn-ghost btn-sm" style="width:auto; margin-top:9px;" onclick="swapFromTo()">⇅ Swap From / To</button>
    <label>Amount (₹)</label>
    <input type="number" class="mono" id="f_tamt" value="${amount}" placeholder="0">
    <label>Date</label>
    <input type="date" id="f_tdate" value="${date}">
    <label>Note (optional)</label>
    <input type="text" id="f_tnote" value="${esc(note)}" placeholder="e.g. Advance for next IPO">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTxn()">Save</button>
    </div>
    ${existing? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteTxn('${existing.id}')">Delete Transfer</button>`:''}
  `);
}
function swapFromTo(){
  const f = document.getElementById('f_from'), t = document.getElementById('f_to');
  const tmp = f.value; f.value = t.value; t.value = tmp;
}
function saveTxn(){
  const fromUserId = document.getElementById('f_from').value;
  const toUserId = document.getElementById('f_to').value;
  const amount = parseFloat(document.getElementById('f_tamt').value)||0;
  const date = document.getElementById('f_tdate').value || todayISO();
  const note = document.getElementById('f_tnote').value.trim();
  if(!fromUserId || !toUserId){ showToast('Select both users'); return; }
  if(fromUserId===toUserId){ showToast('From and To must be different'); return; }
  if(amount<=0){ showToast('Enter an amount'); return; }
  if(editingTxnId){
    const t = state.transactions.find(x=>x.id===editingTxnId);
    Object.assign(t, {fromUserId, toUserId, amount, date, note});
  } else {
    state.transactions.push({id:uid(), fromUserId, toUserId, amount, date, note});
  }
  editingTxnId = null;
  saveState(); closeModal(); render(); showToast('Transfer saved');
}
function deleteTxn(txnId){
  if(!confirm('Delete this transfer record?')) return;
  state.transactions = state.transactions.filter(t=>t.id!==txnId);
  editingTxnId = null;
  saveState(); closeModal(); render(); showToast('Transfer deleted');
}

/* ============================= INIT ============================= */
loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
