<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Aryan's IPO Manager Software</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2334d399'/%3E%3Cstop offset='100%25' stop-color='%2338bdf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='%23000000'/%3E%3Crect x='2' y='2' width='60' height='60' rx='11' fill='none' stroke='url(%23g)' stroke-width='2' opacity='0.7'/%3E%3Ctext x='7' y='43' font-family='Arial Black,Arial,sans-serif' font-weight='900' font-size='26' letter-spacing='1' fill='url(%23g)'%3EIPO%3C/text%3E%3Cline x1='7' y1='49' x2='57' y2='49' stroke='url(%23g)' stroke-width='2' stroke-linecap='round' opacity='0.7'/%3E%3C/svg%3E">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aryan's IPO Manager">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --bg-elev:#0a0a0a;
    --bg-elev-2:#121212;
    --border:#242424;
    --border-soft:#1a1a1a;
    --text:#ededec;
    --text-dim:#8f8f95;
    --text-faint:#5c5c62;
    --gold:#2dd4bf;
    --gold-dim:#1f9c8c;
    --gold-grad:linear-gradient(135deg, #34d399, #38bdf8);
    --profit:#5fd188;
    --loss:#f0685f;
    --pending:#7a7a82;
    --radius:14px;
    --radius-sm:9px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',sans-serif;
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums;}
  .disp{font-family:'Space Grotesk',sans-serif;}
  ::selection{background:var(--gold); color:#000000;}
  a{color:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}

  header.topbar{
    position:sticky; top:0; z-index:20;
    background:rgba(10,10,11,0.86); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border-soft);
    padding:18px 20px 14px;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{
    width:44px; height:36px; border-radius:9px;
    background:#000000; border:1.5px solid var(--gold-dim);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; box-shadow:0 0 0 1px rgba(45,212,191,0.08), 0 2px 8px rgba(0,0,0,0.5);
  }
  .brand .mark svg{ display:block; }
  .brand h1{font-family:'Space Grotesk',sans-serif; font-size:17px; margin:0; font-weight:600; letter-spacing:0.2px;}
  .brand .sub{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .page-title{font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:600; margin:2px 0 4px;}
  .page-sub{font-size:12.5px; color:var(--text-dim); margin-bottom:0;}

  main{max-width:640px; margin:0 auto; padding:18px 16px calc(96px + env(safe-area-inset-bottom));}

  /* Bottom nav */
  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30;
    background:rgba(15,15,17,0.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--border-soft);
    display:flex; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  }
  nav.tabbar button{
    flex:1; background:none; border:none; color:var(--text-faint);
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:6px 2px; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:500;
    cursor:pointer; border-radius:10px; transition:color .15s;
  }
  nav.tabbar button.active{color:var(--gold);}
  nav.tabbar svg{width:20px; height:20px;}

  /* Cards */
  .card{
    background:var(--bg-elev); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:16px; margin-bottom:12px;
  }
  .card-tight{padding:14px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .stat{
    background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius-sm);
    padding:13px 14px;
  }
  .stat .label{font-size:10.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.6px; margin-bottom:6px;}
  .stat .value{font-family:'JetBrains Mono',monospace; font-size:19px; font-weight:600; font-variant-numeric:tabular-nums;}
  .stat .value.profit{color:var(--profit);}
  .stat .value.loss{color:var(--loss);}
  .stat .value.gold{color:var(--gold);}

  .section-label{
    font-size:11px; text-transform:uppercase; letter-spacing:0.8px; color:var(--text-faint);
    margin:20px 2px 10px; font-weight:600;
  }
  .section-label:first-child{margin-top:0;}

  .row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
  .list-item{
    background:var(--bg-elev); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:14px 15px; margin-bottom:9px; cursor:pointer; transition:border-color .15s, background .15s;
  }
  .list-item:active{background:var(--bg-elev-2);}
  .list-item .title{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:15px;}
  .list-item .meta{font-size:11.5px; color:var(--text-dim); margin-top:3px;}
  .list-item .right{text-align:right;}

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:600;
    padding:3px 9px; border-radius:99px; text-transform:uppercase; letter-spacing:0.4px;
    border:1px solid var(--border);
  }
  .badge .dot{width:6px; height:6px; border-radius:50%;}
  .badge.upcoming{color:#8fa3d4;} .badge.upcoming .dot{background:#8fa3d4;}
  .badge.open{color:var(--gold);} .badge.open .dot{background:var(--gold);}
  .badge.pending{color:var(--pending);} .badge.pending .dot{background:var(--pending);}
  .badge.allotted{color:#7fb9e8;} .badge.allotted .dot{background:#7fb9e8;}
  .badge.listed{color:var(--profit);} .badge.listed .dot{background:var(--profit);}

  .empty{
    text-align:center; padding:44px 20px; color:var(--text-faint);
  }
  .empty .icon{font-size:30px; margin-bottom:10px; opacity:0.5;}
  .empty .msg{font-size:13px; line-height:1.5;}

  /* Buttons */
  .btn{
    font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px;
    border-radius:11px; padding:12px 18px; border:none; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    transition:transform .1s, opacity .15s; width:100%;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold-grad); color:#000000;}
  .btn-secondary{background:var(--bg-elev-2); color:var(--text); border:1px solid var(--border);}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px solid var(--border-soft);}
  .btn-danger{background:transparent; color:var(--loss); border:1px solid rgba(240,104,95,0.3);}
  .btn-sm{padding:8px 12px; font-size:12.5px; width:auto;}
  .fab{
    position:fixed; right:18px; bottom:88px; z-index:25;
    width:52px; height:52px; border-radius:16px; background:var(--gold-grad); color:#000000;
    border:none; font-size:26px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 24px rgba(56,189,248,0.28); cursor:pointer; line-height:0;
  }

  /* Forms */
  label{display:block; font-size:11.5px; color:var(--text-dim); margin:14px 0 6px; font-weight:500;}
  label:first-child{margin-top:0;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; background:var(--bg-elev-2); border:1px solid var(--border);
    color:var(--text); border-radius:10px; padding:11px 13px; font-size:14.5px;
    font-family:'Inter',sans-serif; outline:none;
  }
  input.mono, .mono-input{font-family:'JetBrains Mono',monospace;}
  input:focus, select:focus, textarea:focus{border-color:var(--gold-dim);}
  input[type=date]{color-scheme:dark;}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .helptext{font-size:11px; color:var(--text-faint); margin-top:5px;}
  .toggle-row{display:flex; gap:8px; margin-top:0;}
  .toggle-btn{
    flex:1; background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text-dim);
    border-radius:10px; padding:10px; font-size:13px; font-weight:600; cursor:pointer;
  }
  .toggle-btn.active{background:rgba(45,212,191,0.14); border-color:var(--gold-dim); color:var(--gold);}
  .chip-list{display:flex; flex-wrap:wrap; gap:7px; margin-top:8px;}
  .chip{
    background:var(--bg-elev-2); border:1px solid var(--border); border-radius:99px;
    padding:6px 10px 6px 12px; font-size:12px; display:flex; align-items:center; gap:7px;
    font-family:'JetBrains Mono',monospace;
  }
  .chip .x{cursor:pointer; color:var(--text-faint); font-size:14px;}
  .date-add-row{display:flex; gap:8px;}
  .date-add-row input{flex:1;}

  /* Modal */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(2px);
    z-index:50; display:flex; align-items:flex-end; justify-content:center;
  }
  .modal{
    background:var(--bg-elev); border:1px solid var(--border); border-top-left-radius:20px; border-top-right-radius:20px;
    width:100%; max-width:640px; max-height:88vh; overflow-y:auto; padding:8px 18px 22px;
    animation:slideup .22s ease-out;
  }
  @keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-handle{width:36px; height:4px; background:var(--border); border-radius:99px; margin:10px auto 14px;}
  .modal-title{font-family:'Space Grotesk',sans-serif; font-size:17px; font-weight:600; margin-bottom:4px;}
  .modal-actions{display:flex; gap:10px; margin-top:20px;}

  /* Tables */
  .tbl{width:100%; border-collapse:collapse; font-size:12.5px;}
  .tbl th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.5px;
    color:var(--text-faint); font-weight:600; padding:0 8px 8px 0; border-bottom:1px solid var(--border-soft);
  }
  .tbl td{padding:9px 8px 9px 0; border-bottom:1px solid var(--border-soft); vertical-align:middle;}
  .tbl tr:last-child td{border-bottom:none;}
  .app-row{background:var(--bg-elev-2); border-radius:12px; padding:13px 14px; margin-bottom:9px; border:1px solid var(--border-soft);}
  .app-row .name{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:14px;}
  .app-row .grid{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-top:10px; font-size:12px;}
  .app-row .grid .k{color:var(--text-faint); font-size:10.5px; text-transform:uppercase; letter-spacing:0.4px;}
  .app-row .grid .v{font-family:'JetBrains Mono',monospace; margin-top:2px;}
  .app-row .actions{display:flex; gap:8px; margin-top:12px;}

  .divider{height:1px; background:var(--border-soft); margin:14px 0;}
  .tab-strip{display:flex; gap:6px; margin-bottom:16px; background:var(--bg-elev); padding:4px; border-radius:12px; border:1px solid var(--border-soft);}
  .tab-strip button{
    flex:1; background:none; border:none; color:var(--text-dim); font-size:12.5px; font-weight:600;
    padding:9px 4px; border-radius:9px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .tab-strip button.active{background:var(--bg-elev-2); color:var(--gold);}

  .avatar{
    width:38px; height:38px; border-radius:10px; background:var(--bg-elev-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; font-family:'Space Grotesk',sans-serif;
    font-weight:600; font-size:14px; color:var(--gold); flex-shrink:0;
  }
  .txn-item{display:flex; align-items:center; gap:11px; padding:11px 0; border-bottom:1px solid var(--border-soft);}
  .txn-item:last-child{border-bottom:none;}
  .txn-dot{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; flex-shrink:0;}
  .txn-dot.out{background:rgba(240,104,95,0.12); color:var(--loss);}
  .txn-dot.in{background:rgba(95,209,136,0.12); color:var(--profit);}
  .toast{
    position:fixed; bottom:92px; left:50%; transform:translateX(-50%); z-index:60;
    background:var(--bg-elev-2); border:1px solid var(--border); color:var(--text); font-size:12.5px;
    padding:10px 16px; border-radius:99px; opacity:0; transition:opacity .25s; pointer-events:none;
  }
  .toast.show{opacity:1;}
  .install-note{font-size:11px; color:var(--text-faint); line-height:1.5; padding:12px 14px; background:var(--bg-elev); border:1px dashed var(--border); border-radius:12px;}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="mark">
      <svg width="38" height="22" viewBox="0 0 38 22" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#34d399"/>
            <stop offset="100%" stop-color="#38bdf8"/>
          </linearGradient>
        </defs>
        <text x="1" y="17" font-family="'Space Grotesk', 'Inter', sans-serif" font-weight="700" font-size="16" letter-spacing="1" fill="url(#brandGrad)">IPO</text>
        <line x1="1" y1="20" x2="37" y2="20" stroke="url(#brandGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
      </svg>
    </div>
    <div>
      <h1>Aryan's IPO Manager</h1>
      <div class="sub" id="headerSub">IPO applications, allotments &amp; settlements</div>
    </div>
  </div>
</header>

<main id="main"></main>

<button class="fab" id="fab" style="display:none;">+</button>

<nav class="tabbar">
  <button data-tab="dashboard" class="tab-btn active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12l2-2 4 4 8-8 4 4"/><path d="M3 20h18" stroke-opacity="0.4"/></svg>
    Dashboard
  </button>
  <button data-tab="ipos" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M8 4v0"/></svg>
    IPOs
  </button>
  <button data-tab="users" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M16 8.5a3 3 0 110 5.9M21.5 20c0-2.9-1.9-5.1-4.5-5.8"/></svg>
    Users
  </button>
  <button data-tab="reports" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 3h8l4 4v14a1 1 0 01-1 1H7a1 1 0 01-1-1V4a1 1 0 011-1z"/><path d="M9 12h6M9 16h6M9 8h3"/></svg>
    Reports
  </button>
</nav>

<div class="toast" id="toast"></div>
<input type="file" id="importFileInput" accept="application/json" style="display:none;">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script>
/* ============================= STATE ============================= */
let state = { users: [], ipos: [], applications: [], transactions: [], withdrawals: [], deposits: [] };
let ready = false;
let activeTab = 'dashboard';
let ipoDetailId = null;
let userDetailId = null;
let ipoDetailSubTab = 'apps';
let ipoSearchQuery = '';
let ipoStatusFilter = 'active';
let userSearchQuery = '';
let editingTxnId = null;

const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtMoney = n => {
  if (n === null || n === undefined || isNaN(n)) return '—';
  const neg = n < 0; n = Math.abs(n);
  const s = n.toLocaleString('en-IN', {maximumFractionDigits:0});
  return (neg?'-':'') + '₹' + s;
};
const fmtDate = iso => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}); };
const fmtDateShort = iso => { if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-IN',{day:'2-digit',month:'short'}); };
const clamp0 = n => Math.max(0, n||0);

/* ============================= STORAGE ============================= */
const STORAGE_KEY = 'lotledger-app-state';
const hasArtifactStorage = (typeof window!=='undefined' && window.storage && typeof window.storage.get==='function');

async function storageGet(key){
  if(hasArtifactStorage){
    try{ return await window.storage.get(key, false); }catch(e){ /* fall through to localStorage */ }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw!=null ? {value: raw} : null;
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(hasArtifactStorage){
    try{ await window.storage.set(key, value, false); return true; }catch(e){ /* fall through */ }
  }
  try{ localStorage.setItem(key, value); return true; }
  catch(e){ return false; }
}

async function loadState(){
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value){ state = JSON.parse(res.value); }
  }catch(e){ /* no data yet */ }
  if(!state.users.some(u=>u.isMe)){
    state.users.unshift({id:uid(), name:'Aryan', isMe:true, defaultCommission:25, openingBalance:0});
  }
  // One-time rename: the account owner used to default to "Me" — rename to Aryan if untouched
  const meUser = state.users.find(u=>u.isMe);
  if(meUser && meUser.name==='Me') meUser.name = 'Aryan';
  state.users.forEach(u=>{ if(u.openingBalance==null) u.openingBalance = 0; });
  // Migrate old transaction schema {userId, type:'given'|'received'} to {fromUserId, toUserId}
  const me = state.users.find(u=>u.isMe);
  state.transactions = (state.transactions||[]).map(t=>{
    if(t.fromUserId!=null && t.toUserId!=null) return t;
    if(t.type==='given') return {id:t.id, date:t.date, note:t.note, amount:t.amount, fromUserId: me?me.id:null, toUserId:t.userId};
    if(t.type==='received') return {id:t.id, date:t.date, note:t.note, amount:t.amount, fromUserId:t.userId, toUserId: me?me.id:null};
    return t;
  }).filter(t=>t.fromUserId && t.toUserId);
  if(!Array.isArray(state.withdrawals)) state.withdrawals = [];
  if(!Array.isArray(state.deposits)) state.deposits = [];
  ready = true;
  maybeDailyAutoBackup();
  render();
}
let saveTimer=null;
function saveState(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const ok = await storageSet(STORAGE_KEY, JSON.stringify(state));
    if(!ok) showToast('Save failed — changes kept locally this session');
  }, 120);
}
// Fix 1: the debounce above means a very-recent edit can still be sitting
// unsaved in memory if the app is closed/backgrounded right away. Flush
// immediately (bypassing the debounce) whenever the app is about to be
// hidden or unloaded, so nothing gets lost.
function flushSaveNow(){
  if(saveTimer){ clearTimeout(saveTimer); saveTimer=null; }
  try{
    const json = JSON.stringify(state);
    localStorage.setItem(STORAGE_KEY, json); // synchronous, always attempted first
    if(hasArtifactStorage){ window.storage.set(STORAGE_KEY, json, false).catch(()=>{}); }
  }catch(e){ /* best effort — nothing more we can do at unload time */ }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden') flushSaveNow(); });
window.addEventListener('pagehide', flushSaveNow);
window.addEventListener('beforeunload', flushSaveNow);

// Fix 2: backup reminder — track when the user last exported a backup so the
// dashboard can nudge them if it's been a while. Stored outside `state` (a
// plain localStorage key) since it's local UI metadata, not app data that
// should round-trip through export/import.
const LAST_BACKUP_KEY = 'lotledger-last-backup-at';
function getLastBackupAt(){
  try{ const v = localStorage.getItem(LAST_BACKUP_KEY); return v ? new Date(v) : null; }catch(e){ return null; }
}
function setLastBackupNow(){
  try{ localStorage.setItem(LAST_BACKUP_KEY, new Date().toISOString()); }catch(e){}
}
function backupReminderText(){
  const last = getLastBackupAt();
  if(!last) return {text:'No backup taken yet', urgent:true};
  const days = Math.floor((Date.now() - last.getTime()) / 86400000);
  if(days<=0) return {text:'Backed up today', urgent:false};
  if(days===1) return {text:'Last backup: 1 day ago', urgent:false};
  return {text:`Last backup: ${days} days ago`, urgent: days>=14};
}

function showToast(msg, duration){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove('show'), duration||1800);
}

function exportData(){
  try{
    const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);

// Fix 3: automatic rotating restore points — a safety net independent of
// manual "Export Backup". Keeps the last 3 snapshots in localStorage so a
// bad import (or any other mistake) can be undone even if the person forgot
// to export first. Snapshots are taken automatically right before an import
// is applied, and at most once per day on app load.
const AUTO_BACKUP_KEY = 'lotledger-autobackups';
function getAutoBackups(){
  try{ return JSON.parse(localStorage.getItem(AUTO_BACKUP_KEY)||'[]'); }catch(e){ return []; }
}
function pushAutoBackup(reason){
  try{
    const list = getAutoBackups();
    list.push({ts: new Date().toISOString(), reason: reason||'auto', data: JSON.stringify(state)});
    while(list.length>3) list.shift(); // keep only the 3 most recent
    localStorage.setItem(AUTO_BACKUP_KEY, JSON.stringify(list));
  }catch(e){ /* best effort — e.g. storage full; skip silently */ }
}
function maybeDailyAutoBackup(){
  const list = getAutoBackups();
  const last = list[list.length-1];
  const today = todayISO();
  if(!last || (last.ts||'').slice(0,10) !== today) pushAutoBackup('daily');
}
function restoreAutoBackup(index){
  const list = getAutoBackups();
  const entry = list[index];
  if(!entry) return;
  const when = new Date(entry.ts).toLocaleString('en-IN', {day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit'});
  confirmAction(`Restore the automatic backup from ${when}? This will replace all current data with that snapshot.`, ()=>{
    try{
      pushAutoBackup('before-restore'); // so restoring isn't itself a one-way door — you can undo a wrong restore too
      state = JSON.parse(entry.data);
      flushSaveNow(); render(); showToast('Restore point loaded');
    }catch(e){ showToast('Could not restore that backup'); }
  }, 'Restore');
}

// Fix 9: validate a backup file's shape before trusting it, so an unrelated
// or corrupted JSON file doesn't silently load broken data into the app.
function validateBackupShape(parsed){
  if(!parsed || typeof parsed!=='object' || Array.isArray(parsed)) return 'That file is not a valid backup (not a JSON object).';
  if(!Array.isArray(parsed.users)) return 'That file is missing a "users" list — this may not be a Lot & Ledger / IPO Manager backup.';
  if(!Array.isArray(parsed.ipos)) return 'That file is missing an "ipos" list — this may not be a Lot & Ledger / IPO Manager backup.';
  const arrayFields = ['applications','transactions','withdrawals','deposits'];
  for(const f of arrayFields){ if(parsed[f]!=null && !Array.isArray(parsed[f])) return `"${f}" in that file is not a list — the backup looks corrupted.`; }
  for(const u of parsed.users){ if(!u || typeof u!=='object' || !u.id || typeof u.name!=='string') return 'One or more users in that file are missing an id/name — the backup looks corrupted.'; }
  for(const i of parsed.ipos){ if(!i || typeof i!=='object' || !i.id || typeof i.name!=='string') return 'One or more IPOs in that file are missing an id/name — the backup looks corrupted.'; }
  const userIds = new Set(parsed.users.map(u=>u.id));
  const ipoIds = new Set(parsed.ipos.map(i=>i.id));
  if(Array.isArray(parsed.applications)){
    for(const a of parsed.applications){
      if(!a || typeof a!=='object' || !a.id) return 'One or more applications in that file are missing an id — the backup looks corrupted.';
      if(a.userId && !userIds.has(a.userId)) return 'An application in that file references a user that isn\'t in the same backup — the file looks corrupted or mismatched.';
      if(a.ipoId && !ipoIds.has(a.ipoId)) return 'An application in that file references an IPO that isn\'t in the same backup — the file looks corrupted or mismatched.';
    }
  }
  return null; // shape looks valid
}
document.getElementById('importFileInput').addEventListener('change', async (e)=>{
  const file = e.target.files[0];
  e.target.value = '';
  if(!file) return;
  try{
    const text = await file.text();
    const parsed = JSON.parse(text);
    const shapeError = validateBackupShape(parsed);
    if(shapeError){ showToast(shapeError, 5000); return; }
    confirmAction('Import this backup? It will replace all current data in the app.', ()=>{
      pushAutoBackup('before-import'); // safety net — lets you undo this if the import turns out wrong
      // Restore all known keys; unknown keys from newer versions are preserved as-is
      state = {
        users: parsed.users||[], ipos: parsed.ipos||[],
        applications: parsed.applications||[], transactions: parsed.transactions||[],
        withdrawals: parsed.withdrawals||[], deposits: parsed.deposits||[]
      };
      // Carry forward any extra top-level keys from newer backup versions
      Object.keys(parsed).forEach(k=>{
        if(!['users','ipos','applications','transactions','withdrawals','deposits'].includes(k)){
          state[k] = parsed[k];
        }
      });
      if(!state.users.some(u=>u.isMe)) state.users.unshift({id:uid(), name:'Aryan', isMe:true, defaultCommission:25});
      saveState(); render(); showToast('Backup imported successfully (' + state.users.length + ' users, ' + state.ipos.length + ' IPOs)');
    }, 'Import');
  }catch(err){ showToast('Could not read that file — make sure it is a valid backup JSON.'); }
});

/* ============================= CALCULATIONS ============================= */
function ipoStatus(ipo){
  const t = todayISO();
  const dates = (ipo.biddingDates||[]).slice().sort();
  if(dates.length){
    if(t < dates[0]) return 'upcoming';
    if(t <= dates[dates.length-1]) return 'open';
  }
  if(ipo.allotmentDate && t < ipo.allotmentDate) return 'pending';
  if(ipo.listingDate && t < ipo.listingDate) return 'allotted';
  if(ipo.listingDate && t >= ipo.listingDate) return 'listed';
  return 'pending';
}
const STATUS_LABEL = {upcoming:'Upcoming', open:'Bidding Open', pending:'Allotment Pending', allotted:'Allotted · Awaiting Listing', listed:'Listed'};

function totalCost(app, ipo){ return (app.lots||0) * (ipo.lotSize||0) * (ipo.pricePerShare||0); }

// Expected profit per share/lot based on GMP (Grey Market Premium) entered manually for the IPO.
// This is a projection only, distinct from computeApp()'s actual realized profit after sale.
function expectedProfitPerShare(ipo){ return ipo.gmp!=null ? ipo.gmp : null; }
function expectedProfitPerLot(ipo){ const gmp = expectedProfitPerShare(ipo); return gmp!=null ? gmp*(ipo.lotSize||0) : null; }
function expectedProfitForApp(app, ipo){
  const gmp = expectedProfitPerShare(ipo);
  if(gmp==null) return null;
  const lots = (app.lotsAllotted!=null? app.lotsAllotted : app.lots) || 0;
  return gmp * lots * (ipo.lotSize||0);
}
function expectedProfitForIpo(ipo){
  const gmp = expectedProfitPerShare(ipo);
  if(gmp==null) return null;
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);
  return apps.reduce((sum,a)=> sum + (expectedProfitForApp(a, ipo)||0), 0);
}
function lastApplyDate(ipo){
  const dates = (ipo.biddingDates||[]).slice().sort();
  return dates.length ? dates[dates.length-1] : null;
}

// Determine profit-sharing mode: 'commission' (all profit is mine, user gets a % commission),
// 'assisted' (both invest their own real stake — Aryan from Account A, user from Account B — each
// principal returns to its own account, but PROFIT is split by a flat commission %, not by ratio),
// or 'shared' (profit split by each party's invested-amount ratio, with an optional bonus top-up to the user).
// Funding source itself is no longer a separate concept — every application is applied through the
// user's own account; this only governs how PROFIT is split, and therefore how much of the applied
// amount is "mine" (aryanInvested) vs the user's own money.
function profitModeOf(app){
  if(app.profitMode) return app.profitMode;
  // Backward-compat migration from the old 3-way fundingSource field ('me' | 'shared' | 'own')
  const src = app.fundingSource;
  if(src==='own') return 'shared';
  if(src==='shared') return 'shared';
  return 'commission';
}

// Full settlement computation for a single application
function computeApp(app, ipo, user){
  const fullCost = totalCost(app, ipo);
  const isMe = user && user.isMe;
  const mode = isMe ? 'commission' : profitModeOf(app);
  const funded = app.fundedByMe||0; // amount I (Aryan) put into this application
  // amountGiven = actual cash handed over, which may exceed what was applied (fundedByMe).
  // Falls back to funded for older records saved before this field existed.
  const given = app.amountGiven!=null ? app.amountGiven : funded;
  const extraGiven = clamp0(given - funded); // cash given but never applied to this IPO — always owed back
  const userInvested = (!isMe && mode==='assisted') ? clamp0(app.userInvested||0) : 0; // user's own stake in Assisted mode (Account B)
  const out = {
    fullCost, isMe, profitMode: mode, aryanInvested: funded, userInvested, extraGiven,
    status: 'pending', // pending | refunded | holding | settled
    X: 0, nEff: 0, sEff: 0, unallottedRefund: 0,
    proceeds: null, profit: null, commission: 0, myProfitShare: null, friendShare: null,
    owedToMe: 0
  };
  if(app.allotted === false){
    // Not allotted: the broker refunds the full applied amount directly into the USER's own account,
    // plus any extra cash given is owed back — this sits as a receivable in the user's tracked balance
    // until Aryan actually collects it via a real transfer, not credited to Aryan's account automatically.
    out.status = 'refunded';
    out.X = 0; out.unallottedRefund = funded;
    out.owedToMe = isMe ? 0 : (funded + extraGiven);
    return out;
  }
  if(app.allotted !== true){
    // Still awaiting allotment result — money funded is already out of pocket and into the applicant's
    // application (blocked), so it's a live receivable. Extra cash given beyond what was applied is
    // owed back regardless of allotment outcome.
    out.status = 'pending';
    out.owedToMe = isMe ? 0 : (funded + extraGiven);
    return out;
  }
  // allotted
  const lotsAllotted = (app.lotsAllotted!=null? app.lotsAllotted : app.lots) || 0;
  const X = lotsAllotted * (ipo.lotSize||0) * (ipo.pricePerShare||0);
  out.X = X;
  const nEff = Math.min(funded, X);
  const sEff = clamp0(X - nEff);
  out.nEff = nEff; out.sEff = sEff;
  out.unallottedRefund = clamp0(funded - nEff);

  if(app.sellPrice === null || app.sellPrice === undefined || app.sellPrice === ''){
    out.status = 'holding';
    // Allotted but not yet listed/sold: this capital is BLOCKED — held in the user's account, not
    // available to Aryan for funding a new application until it's actually sold and transferred back.
    out.owedToMe = isMe ? 0 : (nEff + out.unallottedRefund + extraGiven);
    return out;
  }
  // sold
  out.status = 'settled';
  const proceeds = lotsAllotted * (ipo.lotSize||0) * app.sellPrice;
  const profit = proceeds - X;
  out.proceeds = proceeds; out.profit = profit;

  if(isMe){
    // Self-applied: broker pays straight into Aryan's own account, no intermediary — realized instantly.
    out.myProfitShare = profit;
    out.owedToMe = 0;
    return out;
  }

  if(mode==='commission'){
    // All profit is mine; user earns a commission % of positive profit only.
    const commPct = (app.commissionPercent!=null? app.commissionPercent : (user.defaultCommission||0));
    const commission = profit > 0 ? profit * (commPct/100) : 0;
    out.commission = commission;
    out.myProfitShare = profit - commission;
    out.friendShare = commission;
  } else if(mode==='assisted'){
    // Assisted mode: like Shared, both invest their own real stake — Aryan's (funded/aryanInvested)
    // from Account A, the user's (userInvested = fullCost - funded) from Account B — and each
    // principal returns to its own account exactly as invested, same as Shared. Unlike Shared,
    // PROFIT is split by a flat commission % instead of the invested-amount ratio.
    const commPct = (app.commissionPercent!=null? app.commissionPercent : (user.defaultCommission||0));
    const friendShare = profit > 0 ? profit * (commPct/100) : 0;
    out.commission = friendShare;
    out.myProfitShare = profit - friendShare;
    out.friendShare = friendShare;
  } else {
    // shared (default) -> profit split by investment ratio, then an optional flat bonus
    // (extra amount Aryan chooses to give the user above their ratio-based share) shifts some of
    // my share to the user.
    let myShare = X>0 ? profit * (nEff/X) : 0;
    let friendShare = X>0 ? profit * (sEff/X) : 0;
    if(profit > 0){
      const bonus = Math.min(clamp0(app.bonusToUser||0), Math.max(myShare,0));
      myShare -= bonus;
      friendShare += bonus;
    }
    out.myProfitShare = myShare;
    out.friendShare = friendShare;
    out.commission = 0;
  }
  // Everything owed to me sits in the user's account until they physically transfer it back:
  // my principal returned (nEff + unallotted refund) + my profit share + any extra cash given.
  // NOTE: in assisted mode, userInvested (Account B principal) is NOT included — it's the user's own
  // money returned to their Account B, never owed to Aryan.
  out.owedToMe = out.unallottedRefund + nEff + out.myProfitShare + extraGiven;
  return out;
}

// Generalized, synchronized transfer ledger: for ANY user (including Aryan), sum every transaction
// where they are the receiver (+amount) or the sender (-amount). Because this is recomputed live from
// state.transactions, deleting a transfer automatically "undoes" it on both sides — there's nothing to
// separately reverse.
function transfersNet(userId){
  let net = 0;
  state.transactions.forEach(t=>{
    if(t.toUserId===userId) net += t.amount;
    if(t.fromUserId===userId) net -= t.amount;
  });
  return net;
}

// Same as transfersNet, but scoped to a single sub-account ('A' or 'B') of a non-Aryan user.
// A transaction only affects a given sub-account total on the side(s) where its fromAccount/toAccount
// tag matches — this is what lets internal A<->B moves (same user on both sides, different accounts)
// correctly shift money between the two totals instead of netting to zero everywhere.
function transfersNetAccount(userId, account){
  let net = 0;
  state.transactions.forEach(t=>{
    if(t.toUserId===userId && t.toAccount===account) net += t.amount;
    if(t.fromUserId===userId && t.fromAccount===account) net -= t.amount;
  });
  return net;
}

// account: optional 'A' | 'B' to scope to one sub-account. Legacy withdrawals recorded before the
// two-account model (no `account` field) default to Account A for non-Aryan users, since everything
// previously owed to Aryan through a user's tracked balance is what Account A now represents.
function withdrawalsFor(userId, account){
  return (state.withdrawals||[]).filter(w=>{
    if(w.userId!==userId) return false;
    if(account==null) return true;
    return (w.account||'A')===account;
  }).reduce((s,w)=>s+w.amount,0);
}
function depositsFor(userId){
  return (state.deposits||[]).filter(d=>d.userId===userId).reduce((s,d)=>s+d.amount,0);
}

// ---- Two-account model for every non-Aryan user ----
// Account A: Aryan's own money sitting with the user — every transfer Aryan sends them, plus Aryan's
//   principal/profit from their settled or refunded applications that hasn't been transferred back yet.
//   This is the ONLY account an application's Aryan-funded share is deducted from, and the ONLY account
//   a "Transfer to Aryan" can draw from.
// Account B: the user's OWN money — cash they've added themselves (Add Cash to Account), plus their own
//   commission/profit share from settled applications. This is what their own share of a Shared
//   Investment application is deducted from.
// Both are wallets with a real, checkable balance (not an open-ended receivable): funding an application
// actually removes money from whichever account(s) cover it while the application is unresolved, and the
// money reappears in that account automatically once the application is refunded or settled — no manual
// "return" step needed.
function appAccountALock(app, ipo, user){
  if(!user || user.isMe) return 0;
  const c = computeApp(app, ipo, user);
  let lock = c.extraGiven||0; // extra cash given beyond what was applied is always owed back, at every stage
  if(c.status==='pending' || c.status==='holding') lock += (c.aryanInvested||0);
  if(c.status==='settled') lock -= (c.myProfitShare||0); // profit is a net credit back into Account A
  return lock;
}
function appAccountBLock(app, ipo, user){
  if(!user || user.isMe) return 0;
  const c = computeApp(app, ipo, user);
  let lock = 0;
  // Shared and Assisted modes both work identically here: the user's own stake (fullCost - aryanInvested,
  // same value as userInvested in Assisted mode) is locked from Account B while pending/holding, and
  // released — plus their profit share (ratio-based for Shared, commission-based for Assisted, both
  // already computed into c.friendShare by computeApp) — once settled. Refunded releases the lock with
  // no profit/loss on either side. Commission mode locks nothing from B (full cost is Aryan's, Account A only).
  if(c.status==='pending' || c.status==='holding') lock += clamp0(c.fullCost - (c.aryanInvested||0));
  if(c.status==='settled'){
    const userProfit = c.profitMode==='commission' ? (c.commission||0) : (c.friendShare||0);
    lock -= userProfit; // their commission/profit share is a net credit back into Account B
  }
  return lock;
}
// excludeAppId: when re-checking balance for an application being edited, pass its own id so its
// existing (still-pending) commitment isn't counted against itself.
function accountABalance(userId, excludeAppId){
  const user = state.users.find(u=>u.id===userId);
  if(!user || user.isMe) return 0;
  let lock = 0;
  state.applications.filter(a=>a.userId===userId).forEach(a=>{
    if(excludeAppId && a.id===excludeAppId) return;
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    lock += appAccountALock(a, ipo, user);
  });
  return (user.openingBalance||0) + transfersNetAccount(userId,'A') - withdrawalsFor(userId,'A') - lock;
}
function accountBBalance(userId, excludeAppId){
  const user = state.users.find(u=>u.id===userId);
  if(!user || user.isMe) return 0;
  let lock = 0;
  state.applications.filter(a=>a.userId===userId).forEach(a=>{
    if(excludeAppId && a.id===excludeAppId) return;
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    lock += appAccountBLock(a, ipo, user);
  });
  return depositsFor(userId) + transfersNetAccount(userId,'B') - withdrawalsFor(userId,'B') - lock;
}

function userBalance(userId){
  const user = state.users.find(u=>u.id===userId);
  if(!user || user.isMe) return {owed:0, transfers:0, withdrawn:0, net:0, opening:0, accountA:0, accountB:0};
  const transfers = transfersNet(userId);
  const withdrawn = withdrawalsFor(userId);
  const opening = user.openingBalance||0;
  const accountA = accountABalance(userId);
  const accountB = accountBBalance(userId);
  const net = accountA + accountB; // positive => total money currently tracked in their two accounts
  // "Owed via IPOs" = what's currently owed right now, i.e. Account A itself (clamped at 0 — a negative
  // Account A means Aryan owes them, not the other way round). This used to be a separate raw sum of every
  // application's owedToMe regardless of status, which double-counted: a settled application's money stays
  // in owedToMe forever even once its principal gets reused (rolled over) straight into a fresh application,
  // so the same real rupees showed up twice. Account A already handles this correctly (a settled app's
  // capital drops out the moment it's spent again on a new one, same fix as myDeployedCapital()), so reuse
  // it directly instead of keeping a second, inconsistent number.
  const owed = clamp0(accountA);
  return {owed, transfers, withdrawn, net, opening, accountA, accountB};
}

// Capital currently tied up in an ONGOING IPO application (result not known yet) — for both Aryan's own
// applications and friends' applications alike. Once an application settles or gets refunded, its money
// is no longer "at risk in the market" — it just needs collecting back (friends: shows under Pending
// Repayments once uncollected; Aryan's own: credits immediately via myOwnRealizedProfit) — so it correctly
// drops out of this figure the moment a result comes in, rather than staying counted forever.
function myDeployedCapital(){
  let total = 0;
  state.applications.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const user = state.users.find(u=>u.id===a.userId); if(!user) return;
    const c = computeApp(a, ipo, user);
    if(c.status!=='pending' && c.status!=='holding') return;
    total += (c.aryanInvested||0) + (c.extraGiven||0);
  });
  return total;
}

// Profit realized directly into Aryan's own account from his own (isMe) settled applications — no
// intermediary user account is involved, so this credits immediately at settlement.
function myOwnRealizedProfit(){
  let total = 0;
  state.applications.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const user = state.users.find(u=>u.id===a.userId); if(!user || !user.isMe) return;
    const c = computeApp(a, ipo, user);
    if(c.status==='settled') total += (c.profit||0);
  });
  return total;
}

// What should actually reduce Aryan's own LIQUID balance — distinct from myDeployedCapital() (which is
// the informational "how much is currently tied up in the field" figure shown on the dashboard).
// For a FRIEND application, `aryanInvested` (fundedByMe) is money that only ever reached them because a
// real "Log Transfer" topped up their Account A first — the app's own balance check on Add Applicant
// enforces this, there's no other way to fund it. That transfer already reduced transfersNet(me), so
// subtracting aryanInvested again here would double-count the exact same rupees. Only `extraGiven` (cash
// handed over beyond the tracked funding — which the Add Applicant helptext explicitly says NOT to log as
// a separate transfer) has no other place it's accounted for, so it alone still needs deducting here.
// For Aryan's own (isMe) applications there's no intermediary transfer at all, so the full capital is
// deducted here while pending/holding, exactly like myDeployedCapital().
function myLiquidCapitalOut(){
  let total = 0;
  state.applications.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const user = state.users.find(u=>u.id===a.userId); if(!user) return;
    const c = computeApp(a, ipo, user);
    if(user.isMe){
      const capital = (c.aryanInvested||0) + (c.extraGiven||0);
      if(capital>0 && (c.status==='pending' || c.status==='holding')) total += capital;
    } else {
      if((c.extraGiven||0)>0) total += c.extraGiven;
    }
  });
  return total;
}

function myTotals(){
  let profitMine = 0, commissionEarnedByFriends = 0, outstanding = 0;
  state.applications.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const user = state.users.find(u=>u.id===a.userId); if(!user) return;
    const c = computeApp(a, ipo, user);
    if(user.isMe && c.status==='settled') profitMine += (c.profit||0);
    if(!user.isMe && c.status==='settled'){ profitMine += (c.myProfitShare||0); commissionEarnedByFriends += (c.commission||0); }
  });
  // Capital Deployed (dashboard, informational): money currently locked in an ONGOING application (result
  // still pending) — see myDeployedCapital()'s own comment. This is a different question from what
  // myAccountBalance() subtracts (myLiquidCapitalOut()), so the two are allowed to differ.
  const deployed = myDeployedCapital();
  state.users.filter(u=>!u.isMe).forEach(u=>{ outstanding += accountABalance(u.id); }); // only Account A counts as "owed back to Aryan" — Account B is the user's own money, never a repayment

  // IPO-level counts
  const activeIpos = state.ipos.filter(i=>!i.archived && ipoStatus(i)!=='listed');
  const totalIpos = state.ipos.length;
  const allottedIpos = state.ipos.filter(i=>{
    const apps = state.applications.filter(a=>a.ipoId===i.id);
    return apps.length>0 && apps.some(a=>a.allotted===true);
  }).length;

  // Fund given / returned — from the funding & repayment (money transfer) ledger, Me -> Users vs Users -> Me
  const me = state.users.find(u=>u.isMe);
  let fundGiven = 0, fundReturned = 0;
  if(me){
    state.transactions.forEach(t=>{
      if(t.fromUserId===me.id && t.toUserId!==me.id) fundGiven += t.amount;
      if(t.toUserId===me.id && t.fromUserId!==me.id) fundReturned += t.amount;
    });
  }

  return {deployed, profitMine, commissionEarnedByFriends, outstanding,
    totalIpos, activeIpos: activeIpos.length, allottedIpos, fundGiven, fundReturned};
}

// My Account = LIQUID cash actually in Aryan's own hands right now:
// opening balance + cash deposited - cash withdrawn + net of real money transfers actually received/sent
// - capital that has genuinely left Aryan's own pocket and isn't reflected anywhere else (myLiquidCapitalOut,
//   see its own comment for why this is NOT the same as myDeployedCapital()) + Aryan's own realized profit.
function myAccountBalance(){
  const me = state.users.find(u=>u.isMe);
  if(!me) return 0;
  const opening = me.openingBalance||0;
  const withdrawn = withdrawalsFor(me.id);
  const deposited = depositsFor(me.id);
  const transfers = transfersNet(me.id);
  return opening + deposited - withdrawn + transfers - myLiquidCapitalOut() + myOwnRealizedProfit();
}

// Total value sitting in friends' accounts = the sum of Account A (Aryan's money with them) + Account B
// (their own money) across every non-Aryan user.
function totalInOthersAccounts(){
  let total = 0;
  state.users.filter(u=>!u.isMe).forEach(u=>{
    total += accountABalance(u.id) + accountBBalance(u.id);
  });
  return total;
}

function nextKeyDate(ipo){
  const t = todayISO();
  const candidates = [];
  (ipo.biddingDates||[]).forEach(d=>{ if(d>=t) candidates.push({date:d, label:'Bidding'}); });
  if(ipo.allotmentDate && ipo.allotmentDate>=t) candidates.push({date:ipo.allotmentDate, label:'Allotment'});
  if(ipo.listingDate && ipo.listingDate>=t) candidates.push({date:ipo.listingDate, label:'Listing'});
  candidates.sort((a,b)=>a.date.localeCompare(b.date));
  return candidates[0];
}
function statusBadge(ipo){
  if(ipo.archived) return `<span class="badge pending"><span class="dot"></span>Archived</span>`;
  const s = ipoStatus(ipo);
  let extra = '';
  if(s==='open'){
    const dates = (ipo.biddingDates||[]).slice().sort();
    const last = dates[dates.length-1];
    if(last){
      const days = Math.round((new Date(last+'T00:00:00') - new Date(todayISO()+'T00:00:00'))/86400000);
      if(days===0) extra = ' · Closes today';
      else if(days>0) extra = ` · ${days}d left`;
    }
  }
  return `<span class="badge ${s}"><span class="dot"></span>${STATUS_LABEL[s]}${extra}</span>`;
}

}

function renderIpoSummary(ipo, apps, totalProfit, totalCommission){
  const allotted = apps.filter(a=>a.allotted===true).length;
  const notAllotted = apps.filter(a=>a.allotted===false).length;
  const pending = apps.filter(a=>a.allotted==null).length;
  // Only count capital still genuinely deployed (awaiting result) for THIS IPO — same rule as the
  // dashboard's myDeployedCapital(): pending/holding only. Previously this summed fundedByMe for every
  // non-refunded application regardless of status, so a settled application's capital stayed counted
  // here forever even after it was fully collected back via a real transfer — the same double-counting
  // bug the dashboard's "Capital Deployed" tile had before the v5.4.9 fix, just not caught here at the time.
  const totalDeployed = apps.reduce((s,a)=>{
    const u = state.users.find(x=>x.id===a.userId); if(!u) return s;
    const c = computeApp(a, ipo, u);
    return (c.status==='pending' || c.status==='holding') ? s + (c.aryanInvested||0) : s;
  }, 0);
  return `
    <div class="stat-grid">
      <div class="stat"><div class="label">Allotted</div><div class="value">${allotted}</div></div>
      <div class="stat"><div class="label">Not Allotted</div><div class="value">${notAllotted}</div></div>
      <div class="stat"><div class="label">Awaiting Result</div><div class="value">${pending}</div></div>
      <div class="stat"><div class="label">Capital I Put In</div><div class="value gold">${fmtMoney(totalDeployed)}</div></div>
      <div class="stat"><div class="label">Total Profit (Mine)</div><div class="value ${totalProfit>=0?'profit':'loss'}">${fmtMoney(totalProfit)}</div></div>
      <div class="stat"><div class="label">Commission Paid</div><div class="value">${fmtMoney(totalCommission)}</div></div>
    </div>
  `;
}
function initials(name){ return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

function setAllotment(appId, allotted){
  const a = state.applications.find(x=>x.id===appId); if(!a) return;
  a.allotted = allotted;
  if(allotted && a.lotsAllotted==null) a.lotsAllotted = a.lots;
  if(!allotted){ a.lotsAllotted=null; a.sellPrice=null; }
  saveState(); render();
  showToast(allotted? 'Marked as allotted' : 'Marked as not allotted');
}
// Lets a mis-tap on "Mark Allotted" / "Not Allotted" be undone — resets the result back to "awaiting
// result" so the Mark Allotted / Not Allotted buttons reappear and it can be set correctly. Warns
// specifically if a sell price was already entered, since that gets cleared too.
function undoAllotment(appId){
  const a = state.applications.find(x=>x.id===appId); if(!a) return;
  const hadSell = a.sellPrice!=null;
  const extraWarn = hadSell ? ' This also clears the sell price that was already entered. If you already did a "Transfer to Aryan" for this user since it settled, that transfer stays logged as-is — double check their Account A balance afterward.' : '';
  confirmAction(
    `Reset the allotment result for this applicant back to "awaiting result"?${extraWarn} You'll be able to mark Allotted / Not Allotted again.`,
    ()=>{
      a.allotted = null;
      a.lotsAllotted = null;
      a.sellPrice = null;
      saveState(); render(); showToast('Allotment result reset');
    },
    'Reset'
  );
}
function promptSellPrice(appId){
  const a = state.applications.find(x=>x.id===appId); const ipo = state.ipos.find(i=>i.id===a.ipoId);
  openSellModal(appId, ipo);
}
function promptListingPrice(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId);
  openListingPriceModal(ipo);
}
function deleteApp(appId){
  confirmAction('Remove this applicant from the IPO? This cannot be undone.', ()=>{
    state.applications = state.applications.filter(a=>a.id!==appId);
    saveState(); render(); showToast('Applicant removed');
  });
}

// "Transfer to Aryan" always pulls from the user's Account A only — that's the account that represents
// Aryan's own money sitting with them (their own Account B money is never swept to Aryan automatically).
function settleUp(userId){
  const availA = accountABalance(userId);
  const me = state.users.find(u=>u.isMe);
  if(availA<=0){ showToast('Nothing in Account A to transfer'); return; }
  openTxnModal(null, null, {fromUserId:userId, toUserId:me.id, amount:availA, note:'Transfer to Aryan (Account A)'});
}
// Transfer everything Account A holds for this user PLUS an extra discretionary amount Aryan chooses to
// pull, in one go. Creates a single real transfer transaction — that's what actually moves the money
// into Aryan's own account balance; nothing is credited to Aryan until this runs.
function openTransferExtraModal(userId){
  const u = state.users.find(x=>x.id===userId); if(!u) return;
  const availA = accountABalance(userId);
  openModal(`
    <div class="modal-title">Transfer to Aryan + Extra</div>
    <div class="helptext" style="margin:0 0 12px;">Account A balance held by ${esc(u.name)} (Aryan's profit + principal): <strong>${fmtMoney(clamp0(availA))}</strong>. Add any extra amount above that to pull in the same transfer.</div>

    <input type="number" class="mono" id="f_extraAmt" value="" placeholder="0">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="confirmTransferExtra('${userId}')">Continue</button>
    </div>
  `);
}
function confirmTransferExtra(userId){
  const u = state.users.find(x=>x.id===userId); const me = state.users.find(x=>x.isMe);
  const availA = accountABalance(userId);
  const extra = clamp0(parseFloat(document.getElementById('f_extraAmt').value)||0);
  const total = clamp0(availA) + extra;
  if(total<=0){ showToast('Nothing to transfer'); return; }
  closeModal();
  openTxnModal(null, null, {fromUserId:userId, toUserId:me.id, amount:total, note: extra>0? `Profit transfer + extra ₹${extra}` : 'Profit transfer'});
}

      <button class="btn btn-secondary btn-sm" onclick="exportIpoDetailsImage('${reportIpoId}')">Download as Image</button>
    </div>` : ''}

        <button class="btn btn-secondary btn-sm" onclick="exportUserReportCSV('${reportUserId}')">Export CSV</button>
        <button class="btn btn-primary btn-sm" onclick="exportUserReportPDF('${reportUserId}')">Download PDF</button>

function csvCell(v){
  const s = (v===null||v===undefined)? '' : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(rows, filename){
  const csv = rows.map(r=>r.map(csvCell).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
  showToast('CSV downloaded');
}
function exportIpoReportCSV(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo) return;
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);
  const rows = [['Applicant','Lots','Status','Sell Price','Profit/Loss','Owed to Me']];
  apps.forEach(a=>{
    const u = state.users.find(x=>x.id===a.userId); if(!u) return;
    const c = computeApp(a, ipo, u);
    rows.push([u.name, a.lots, c.status, a.sellPrice||'', c.profit!=null?Math.round(c.profit):'', u.isMe?'':Math.round(c.owedToMe)]);
  });
  downloadCSV(rows, `${ipo.name.replace(/[^a-z0-9]+/gi,'-')}-report.csv`);
}
function exportUserReportCSV(userId){
  const u = state.users.find(x=>x.id===userId); if(!u) return;
  const apps = state.applications.filter(a=>a.userId===userId);
  const rows = [['IPO','Lots','Status','Sell Price','Profit/Loss','Owed to Me']];
  apps.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    const c = computeApp(a, ipo, u);
    rows.push([ipo.name, a.lots, c.status, a.sellPrice||'', c.profit!=null?Math.round(c.profit):'', u.isMe?'':Math.round(c.owedToMe)]);
  });
  downloadCSV(rows, `${u.name.replace(/[^a-z0-9]+/gi,'-')}-statement.csv`);
}

/* ============================= PDF EXPORTS ============================= */
const PDF_GOLD = [54,200,200];
const PDF_GRAD_A = [52,211,153];
const PDF_GRAD_B = [56,189,248];
const PDF_DARK = [0,0,0];
const PDF_TEXT = [40,40,42];
const PDF_DIM = [120,120,126];
const PDF_PROFIT = [30,140,80];
const PDF_LOSS = [200,60,55];

function pdfDoc(){
  const { jsPDF } = window.jspdf;
  return new jsPDF({ unit:'pt', format:'a4' });
}

function pdfHeader(doc, title, subtitle){
  const pageWidth = doc.internal.pageSize.getWidth();
  // Header background
  doc.setFillColor(...PDF_DARK);
  doc.rect(0, 0, pageWidth, 68, 'F');

  // Gradient accent strip along the top edge — jsPDF has no native gradient fill,
  // so this is simulated with a series of thin vertical bands interpolating
  // between PDF_GRAD_A (emerald) and PDF_GRAD_B (sky blue).
  const bands = 40, stripH = 3;
  for(let i=0;i<bands;i++){
    const t = i/(bands-1);
    const r = Math.round(PDF_GRAD_A[0] + (PDF_GRAD_B[0]-PDF_GRAD_A[0])*t);
    const g = Math.round(PDF_GRAD_A[1] + (PDF_GRAD_B[1]-PDF_GRAD_A[1])*t);
    const b = Math.round(PDF_GRAD_A[2] + (PDF_GRAD_B[2]-PDF_GRAD_A[2])*t);
    doc.setFillColor(r,g,b);
    doc.rect((pageWidth/bands)*i, 0, pageWidth/bands + 0.5, stripH, 'F');
  }

  // IPO logo mark — black box with gradient-toned border + text
  doc.setFillColor(0, 0, 0);
  doc.roundedRect(28, 10, 46, 28, 5, 5, 'F');
  doc.setDrawColor(...PDF_GOLD);
  doc.setLineWidth(0.8);
  doc.roundedRect(28, 10, 46, 28, 5, 5, 'S');
  doc.setTextColor(...PDF_GOLD);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(14);
  doc.text('IPO', 51, 29, {align:'center'});
  // Underline inside mark
  // (jsPDF.GState isn't reliably available across builds, so instead of
  // setGState opacity we just draw the line in a dimmer tone to get the
  // same muted look — no opacity API dependency needed.)
  doc.setDrawColor(30, 110, 110);
  doc.setLineWidth(0.6);
  doc.line(32, 33, 70, 33);
  doc.setDrawColor(...PDF_GOLD);

  // App name
  doc.setTextColor(...PDF_GOLD);
  doc.setFont('helvetica', 'bold');
  doc.setFontSize(13);
  doc.text("Aryan's IPO Manager", 82, 22);

  // Report title + subtitle
  doc.setTextColor(255, 255, 255);
  doc.setFont('helvetica', 'normal');
  doc.setFontSize(9.5);
  doc.text(title, 82, 34);
  doc.setTextColor(180, 180, 188);
  doc.setFontSize(8);
  doc.text(subtitle || `Generated ${fmtDate(todayISO())}`, 82, 45);

  doc.setTextColor(...PDF_TEXT);
  return 88;
}

function pdfFooter(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    doc.setFontSize(8);
    doc.setTextColor(...PDF_DIM);
    doc.text(`IPO Manager — Page ${i} of ${pageCount}`, 36, pageHeight-20);
    doc.text(fmtDate(todayISO()), pageWidth-36, pageHeight-20, {align:'right'});
  }
}

function statusLabelFor(c){
  return c.status==='refunded' ? 'Not Allotted'
    : c.status==='holding' ? 'Allotted (Holding)'
    : c.status==='settled' ? 'Allotted (Sold)'
    : 'Awaiting Result';
}

function downloadPDF(doc, filename){
  try{
    doc.save(filename);
    showToast('PDF downloaded');
  }catch(e){ showToast('PDF export failed'); }
}

/* --- Single IPO Report PDF: applied / not applied / allotted / profit per allotment / total profit --- */
function exportIpoReportPDF(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo) return;
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);
  const doc = pdfDoc();
  let y = pdfHeader(doc, `IPO Report — ${ipo.name}`, `Price ${fmtMoney(ipo.pricePerShare)} · Lot ${ipo.lotSize||0} · Last date to apply ${fmtDate(lastApplyDate(ipo))}`);

  const applied = apps.length;
  const notApplied = state.users.length - applied;
  const allotted = apps.filter(a=>a.allotted===true).length;
  const notAllotted = apps.filter(a=>a.allotted===false).length;
  const pending = apps.filter(a=>a.allotted==null).length;
  let totalProfit = 0;
  apps.forEach(a=>{
    const u = state.users.find(x=>x.id===a.userId); if(!u) return;
    const c = computeApp(a, ipo, u);
    if(c.status==='settled') totalProfit += u.isMe ? (c.profit||0) : (c.myProfitShare||0);
  });

  doc.setFontSize(10); doc.setTextColor(...PDF_TEXT); doc.setFont('helvetica','bold');
  doc.text('Summary', 36, y); y += 6;
  doc.autoTable({
    startY: y+6, margin:{left:36,right:36},
    head: [['Applied','Not Applied','Allotted','Not Allotted','Awaiting Result','Total Profit (Mine)']],
    body: [[applied, Math.max(0,notApplied), allotted, notAllotted, pending, fmtMoney(totalProfit)]],
    theme: 'grid',
    headStyles:{ fillColor:PDF_DARK, textColor:255, fontSize:8 },
    bodyStyles:{ fontSize:9 },
    didParseCell: (data)=>{
      if(data.section==='body' && data.column.index===5){
        data.cell.styles.textColor = totalProfit>=0 ? PDF_PROFIT : PDF_LOSS;
        data.cell.styles.fontStyle = 'bold';
      }
    }
  });
  y = doc.lastAutoTable.finalY + 24;

  doc.setFont('helvetica','bold'); doc.setFontSize(10);
  doc.text('Applications', 36, y); y += 6;

  const body = apps.map(a=>{
    const u = state.users.find(x=>x.id===a.userId);
    if(!u) return null;
    const c = computeApp(a, ipo, u);
    const srcLabel = {commission:'Commission', assisted:'Assisted', shared:'Shared'}[c.profitMode] || '—';
    const profitDisplay = c.profit!=null ? fmtMoney(u.isMe? c.profit : c.myProfitShare) : '—';
    return [u.name + (u.isMe?' (You)':''), a.lots, srcLabel, statusLabelFor(c),
      c.status==='settled'? fmtMoney(a.sellPrice) : '—', profitDisplay,
      u.isMe? '—' : (c.owedToMe>0.005 ? fmtMoney(c.owedToMe) : '—')];
  }).filter(Boolean);

  if(body.length){
    doc.autoTable({
      startY: y+6, margin:{left:36,right:36},
      head: [['Applicant','Lots','Funding','Status','Sell Price','Profit (Mine)','Owed to Me']],
      body,
      theme: 'striped',
      headStyles:{ fillColor:PDF_DARK, textColor:255, fontSize:8 },
      bodyStyles:{ fontSize:8.5 },
      alternateRowStyles:{ fillColor:[247,244,238] }
    });
  } else {
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(...PDF_DIM);
    doc.text('No applicants for this IPO yet.', 36, y+14);
  }

  pdfFooter(doc);
  downloadPDF(doc, `${ipo.name.replace(/[^a-z0-9]+/gi,'-')}-report.pdf`);
}

/* --- Date-range Profit Report: settled applications whose IPO's listing date falls in the range.
   NOTE: applications don't store their own settlement timestamp, so ipo.listingDate is used as the
   best available proxy for "when this application's IPO settled" — this is the same date the Sell
   Price modal defaults from and the date money typically becomes collectible. An IPO with no listing
   date set is excluded from every date-range/FY report since there's no date to filter it by. --- */
function appsSettledInRange(fromISO, toISO){
  const out = [];
  state.applications.forEach(a=>{
    const ipo = state.ipos.find(i=>i.id===a.ipoId); if(!ipo) return;
    if(!ipo.listingDate) return;
    if(fromISO && ipo.listingDate < fromISO) return;
    if(toISO && ipo.listingDate > toISO) return;
    const u = state.users.find(x=>x.id===a.userId); if(!u) return;
    const c = computeApp(a, ipo, u);
    if(c.status==='settled') out.push({a, ipo, u, c});
  });
  return out.sort((x,y)=> (x.ipo.listingDate||'').localeCompare(y.ipo.listingDate||''));
}
function exportDateRangeProfitPDF(fromISO, toISO){
  const entries = appsSettledInRange(fromISO, toISO);
  const doc = pdfDoc();
  const rangeLabel = (fromISO||toISO) ? `${fromISO?fmtDate(fromISO):'Start'} — ${toISO?fmtDate(toISO):'Today'}` : 'All time';
  let y = pdfHeader(doc, 'Date-Range Profit Report', `Settled by IPO listing date · ${rangeLabel}`);

  let grandProfit = 0, grandMyShare = 0, grandCommission = 0, grandCapital = 0;
  const ipoIdsSeen = new Set();
  entries.forEach(({a, ipo, u, c})=>{
    grandProfit += (c.profit||0);
    grandMyShare += u.isMe ? (c.profit||0) : (c.myProfitShare||0);
    grandCommission += (c.commission||0);
    grandCapital += (c.aryanInvested||0);
    ipoIdsSeen.add(ipo.id);

  doc.setFontSize(10); doc.setTextColor(...PDF_TEXT); doc.setFont('helvetica','bold');
  doc.text('Summary', 36, y); y += 6;
  doc.autoTable({
    startY: y+6, margin:{left:36,right:36},

  if(entries.length){
    doc.autoTable({
      startY: y+6, margin:{left:36,right:36},
      head: [['Listing Date','IPO','Applicant','Lots','Sell Price','Profit (Total)','Profit (Mine)']],
      body: entries.map(({a, ipo, u, c})=>[

/* --- Financial Year Report: same as date-range, pinned to India's Apr 1 – Mar 31 FY --- */
function fyRangeFor(fyStartYear){
  return { from: `${fyStartYear}-04-01`, to: `${fyStartYear+1}-03-31` };
}
function currentFYStartYear(){
  const d = new Date();
  const y = d.getFullYear();
  return (d.getMonth()+1) >= 4 ? y : y-1; // Jan-Mar belongs to the FY that started the previous April
}
function fyStartYearOf(iso){
  if(!iso) return currentFYStartYear();
  const [y,m] = iso.split('-').map(Number);
  return m>=4 ? y : y-1;
}
function exportFinancialYearPDF(fyStartYear){
  const { from, to } = fyRangeFor(fyStartYear);
  const entries = appsSettledInRange(from, to);
  const doc = pdfDoc();
  const fyLabel = `FY ${fyStartYear}-${String(fyStartYear+1).slice(-2)}`;

  entries.forEach(({c, u})=>{
    grandProfit += (c.profit||0);
    grandMyShare += u.isMe ? (c.profit||0) : (c.myProfitShare||0);
    grandCommission += (c.commission||0);
    grandCapital += (c.aryanInvested||0);
  });

  doc.setFontSize(10); doc.setTextColor(...PDF_TEXT); doc.setFont('helvetica','bold');
  doc.text('Summary', 36, y); y += 6;
  doc.autoTable({
    startY: y+6, margin:{left:36,right:36},
    head: [['Applications Settled','Capital Deployed','Total Profit (Mine)','Commission Paid']],
    body: [[entries.length, fmtMoney(grandCapital), fmtMoney(grandMyShare), fmtMoney(grandCommission)]],

    }
  });
  y = doc.lastAutoTable.finalY + 24;

  // Profit by user within this FY, for a tax-filing-style per-person breakup
  const userMap = new Map();
  entries.forEach(({c, u})=>{
    if(!userMap.has(u.id)) userMap.set(u.id, {u, totalProfit:0, myShare:0, count:0});
    const row = userMap.get(u.id);
    row.totalProfit += (c.profit||0);
    row.myShare += u.isMe ? (c.profit||0) : (c.myProfitShare||0);
    row.count++;
  });
  const userRows = Array.from(userMap.values()).sort((a,b)=>(b.u.isMe?1:0)-(a.u.isMe?1:0) || b.totalProfit-a.totalProfit);

  doc.setFont('helvetica','bold'); doc.setFontSize(10); doc.setTextColor(...PDF_TEXT);

      theme:'striped',
      headStyles:{ fillColor:PDF_DARK, textColor:255, fontSize:8 },

  } else {

    doc.text('No settled applications in this financial year.', 36, y+14);
  }

  pdfFooter(doc);
  downloadPDF(doc, `financial-year-report-${fyLabel.replace(/\s+/g,'-')}.pdf`);
}

/* ============================= IMAGE EXPORT ============================= */
function exportIpoDetailsImage(ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId); if(!ipo){ showToast('IPO not found'); return; }

  const dpr = window.devicePixelRatio || 1;
  const W = 720, PAD = 36;
  const GOLD = '#2dd4bf', PROFIT = '#5fd188', LOSS = '#f0685f', DIM = '#8f8f95', FAINT = '#5c5c62';
  const BG = '#000000', BG2 = '#0a0a0a', BG3 = '#121212', BORDER = '#242424', TEXT = '#ededec';

  const expPerShare = expectedProfitPerShare(ipo);
  const expPerLot = expectedProfitPerLot(ipo);
  const apps = state.applications.filter(a=>a.ipoId===ipo.id);

  // Compute rows
  const rows = [
    ['Price / Share', fmtMoney(ipo.pricePerShare)],
    ['Lot Size', String(ipo.lotSize||0)],
    ['Cost / Lot', fmtMoney((ipo.lotSize||0)*(ipo.pricePerShare||0))],
    ['GMP / Share', ipo.gmp!=null ? (ipo.gmp>=0?'+':'')+fmtMoney(ipo.gmp) : '—'],
    ['Expected Profit / Lot', expPerLot!=null ? fmtMoney(expPerLot) : '—'],
    ['Last Date to Apply', fmtDate(lastApplyDate(ipo))],
    ['Allotment Date', fmtDate(ipo.allotmentDate)],
    ['Listing Date', fmtDate(ipo.listingDate)],
  ];
  if(ipo.listingPrice!=null) rows.push(['Listing Price', fmtMoney(ipo.listingPrice)]);

  const appRows = []; // Per-applicant expected profit removed from IPO details

  // Measure notes wrap BEFORE sizing the canvas — using a fixed height guess
  // here (instead of the real line count) let long notes overflow past the
  // bottom of the canvas, silently clipping the notes text and footer.
  let noteLines = [];
  if(ipo.notes){
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    measureCtx.font = '12px Inter, sans-serif';
    noteLines = wrapText(measureCtx, ipo.notes, W-PAD*2);
  }

  const ROW_H = 38, HEADER_H = 70, TITLE_BLOCK = 88, SECTION_GAP = 20;
  let estimatedH = HEADER_H + TITLE_BLOCK + rows.length * ROW_H + SECTION_GAP;
  if(noteLines.length) estimatedH += 20 + 18 + noteLines.length * 18 + 8; // divider gap + label + actual lines + bottom gap
  estimatedH += 50; // footer + bottom padding

  const canvas = document.createElement('canvas');
  canvas.width = W * dpr; canvas.height = estimatedH * dpr;
  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  const brandGradient = (x0,y0,x1,y1)=>{
    const g = ctx.createLinearGradient(x0,y0,x1,y1);
    g.addColorStop(0, '#34d399'); g.addColorStop(1, '#38bdf8');
    return g;
  };

  // BG
  ctx.fillStyle = BG;
  ctx.fillRect(0, 0, W, estimatedH);

  // Header bar
  ctx.fillStyle = BG2;
  roundRect(ctx, 0, 0, W, HEADER_H, 0);

  // IPO logo mark
  const MX = PAD, MY = 12, MW = 52, MH = 32, MR = 7;
  ctx.fillStyle = '#000000';
  roundRect(ctx, MX, MY, MW, MH, MR);
  ctx.strokeStyle = brandGradient(MX, MY, MX+MW, MY+MH);
  ctx.lineWidth = 1.2;
  ctx.globalAlpha = 0.6;
  roundRectPath(ctx, MX, MY, MW, MH, MR);
  ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.fillStyle = brandGradient(MX, MY, MX+MW, MY+MH);
  ctx.font = 'bold 16px "Space Grotesk", Inter, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('IPO', MX + MW/2, MY + 21);
  ctx.strokeStyle = brandGradient(MX, MY, MX+MW, MY+MH);
  ctx.lineWidth = 0.8;
  ctx.globalAlpha = 0.4;
  ctx.beginPath(); ctx.moveTo(MX+6, MY+MH-6); ctx.lineTo(MX+MW-6, MY+MH-6); ctx.stroke();
  ctx.globalAlpha = 1;
  ctx.textAlign = 'left';

  // App name + subtitle
  const LX = MX + MW + 10;
  ctx.fillStyle = brandGradient(LX, 16, LX+150, 16);
  ctx.font = 'bold 14px "Space Grotesk", Inter, sans-serif';
  ctx.fillText("Aryan's IPO Manager", LX, 28);
  ctx.fillStyle = TEXT;
  ctx.font = '11px Inter, sans-serif';
  ctx.fillText('IPO Details', LX, 44);
  ctx.fillStyle = DIM;
  ctx.font = '10px Inter, sans-serif';
  ctx.fillText(`Generated ${fmtDate(todayISO())}`, LX, 58);

  let y = HEADER_H + 24;

  // IPO name + status
  ctx.fillStyle = TEXT;
  ctx.font = 'bold 22px Inter, sans-serif';
  ctx.fillText(ipo.name, PAD, y); y += 28;
  const st = ipoStatus(ipo);
  const stLabel = STATUS_LABEL[st] || st;
  ctx.fillStyle = GOLD;
  ctx.font = 'bold 11px Inter, sans-serif';
  ctx.fillText('● ' + stLabel.toUpperCase(), PAD, y); y += 28;

  // Divider
  divLine(ctx, PAD, y, W-PAD, BORDER); y += 18;

  // Detail rows
  rows.forEach(([k, v], i)=>{
    const rowY = y + i * ROW_H;
    if(i%2===1){ ctx.fillStyle = BG3; roundRect(ctx, PAD-8, rowY-18, W-PAD*2+16, ROW_H, 6); }
    ctx.fillStyle = FAINT;
    ctx.font = '10px Inter, sans-serif';
    ctx.fillText(k.toUpperCase(), PAD, rowY);
    // color for GMP / expected profit
    let valColor = TEXT;
    if(k.includes('GMP') || k.includes('Expected')){ valColor = expPerShare!=null ? (expPerShare>=0? PROFIT : LOSS) : DIM; }
    ctx.fillStyle = valColor;
    ctx.font = 'bold 14px "Courier New", monospace';
    ctx.textAlign = 'right';
    ctx.fillText(v, W-PAD, rowY+14);
    ctx.textAlign = 'left';
  });
  y += rows.length * ROW_H + SECTION_GAP;

  // Applicants section
  if(appRows.length){
    divLine(ctx, PAD, y, W-PAD, BORDER); y += 20;
    ctx.fillStyle = FAINT;
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.fillText('EXPECTED PROFIT BY APPLICANT', PAD, y); y += 20;
    appRows.forEach(([name, lots, exp], i)=>{
      const rowY = y + i * ROW_H;
      if(i%2===0){ ctx.fillStyle = BG3; roundRect(ctx, PAD-8, rowY-16, W-PAD*2+16, ROW_H, 6); }
      ctx.fillStyle = TEXT;
      ctx.font = '13px Inter, sans-serif';
      ctx.fillText(name, PAD, rowY);
      ctx.fillStyle = DIM;
      ctx.font = '11px Inter, sans-serif';
      ctx.fillText(lots, PAD, rowY+14);
      ctx.fillStyle = expPerShare!=null ? (expPerShare>=0? PROFIT : LOSS) : DIM;
      ctx.font = 'bold 14px "Courier New", monospace';
      ctx.textAlign = 'right';
      ctx.fillText(exp, W-PAD, rowY+8);
      ctx.textAlign = 'left';
    });
    y += appRows.length * ROW_H + SECTION_GAP;
  }

  // Notes
  if(ipo.notes){
    divLine(ctx, PAD, y, W-PAD, BORDER); y += 20;
    ctx.fillStyle = FAINT;
    ctx.font = 'bold 10px Inter, sans-serif';
    ctx.fillText('NOTES', PAD, y); y += 18;
    ctx.fillStyle = DIM;
    ctx.font = '12px Inter, sans-serif';
    // noteLines was already computed pre-sizing (above canvas.width/height), reused here so the
    // wrap result drawn matches exactly what the canvas height was calculated for
    noteLines.forEach(l=>{ ctx.fillText(l, PAD, y); y += 18; });
    y += 8;
  }

  // Footer
  y += 12;
  divLine(ctx, PAD, y, W-PAD, BORDER); y += 16;
  ctx.fillStyle = FAINT;
  ctx.font = '10px Inter, sans-serif';
  ctx.fillText("IPO Manager", PAD, y);
  ctx.textAlign = 'right';
  ctx.fillText(fmtDate(todayISO()), W-PAD, y);
  ctx.textAlign = 'left';

  // Trim canvas to actual height
  const finalH = y + 24;
  const outCanvas = document.createElement('canvas');
  outCanvas.width = W * dpr; outCanvas.height = finalH * dpr;
  const octx = outCanvas.getContext('2d');
  octx.drawImage(canvas, 0, 0);

  outCanvas.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `${ipo.name.replace(/[^a-z0-9]+/gi,'-')}-details.png`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
    showToast('Image downloaded');
  }, 'image/png');
}

function roundRectPath(ctx, x, y, w, h, r){
  // Manual quadratic-curve path (does NOT use native ctx.roundRect, which
  // isn't available on older Android WebView and crashes there).
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h); ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}
function roundRect(ctx, x, y, w, h, r){
  roundRectPath(ctx, x, y, w, h, r);
  ctx.fill();
}
function divLine(ctx, x1, y, x2, color){
  ctx.strokeStyle = color; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1, y); ctx.lineTo(x2, y); ctx.stroke();
}
function wrapText(ctx, text, maxW){
  const words = text.split(' '); const lines = []; let line = '';
  words.forEach(w=>{ const test = line ? line+' '+w : w; if(ctx.measureText(test).width > maxW){ lines.push(line); line = w; } else line = test; });
  if(line) lines.push(line);
  return lines;
}

/* ============================= MODALS ============================= */
function openModal(innerHtml){
  // If a modal is already open (user tapped something that opens a modal
  // twice in quick succession), remove it first instead of stacking a
  // second #modalBackdrop on top — stacked backdrops left stale DOM/state
  // (like window._appModalMode) from the earlier modal still reachable.
  closeModal();
  window._appModalMode = null; // reset here; openAppModal sets its own value right after this call
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'modalBackdrop';
  wrap.innerHTML = `<div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div>${innerHtml}</div>`;
  wrap.addEventListener('click', closeModal);
  document.body.appendChild(wrap);
}
function closeModal(){
  const m = document.getElementById('modalBackdrop');
  if(m) m.remove();
}
// Custom confirmation modal — native confirm() is silently suppressed in
// standalone PWA mode on Android/iOS (see Money Activity delete bug history),
// so all destructive actions route through this instead.
function confirmAction(message, onConfirm, okLabel){
  const wrap = document.createElement('div');
  wrap.className = 'modal-backdrop';
  wrap.id = 'confirmBackdrop';
  wrap.innerHTML = `<div class="modal" onclick="event.stopPropagation()" style="max-width:360px;">
    <div class="modal-handle"></div>
    <div class="modal-title">Are you sure?</div>
    <div style="margin:4px 0 18px; color:var(--text-dim,#999); line-height:1.4;">${esc(message)}</div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="confirmCancelBtn">Cancel</button>
      <button class="btn btn-danger" id="confirmOkBtn">${esc(okLabel||'Delete')}</button>
    </div>
  </div>`;
  const close = ()=>wrap.remove();
  wrap.addEventListener('click', close);
  document.body.appendChild(wrap);
  document.getElementById('confirmCancelBtn').addEventListener('click', (e)=>{ e.stopPropagation(); close(); });
  document.getElementById('confirmOkBtn').addEventListener('click', (e)=>{ e.stopPropagation(); close(); onConfirm(); });
}

function addTempDate(){

function saveIpo(ipoId){
  const name = document.getElementById('f_name').value.trim();
  const price = parseFloat(document.getElementById('f_price').value)||0;
  const lot = parseInt(document.getElementById('f_lot').value)||0;
  const allot = document.getElementById('f_allot').value || null;
  const listing = document.getElementById('f_listing').value || null;
  const gmpVal = document.getElementById('f_gmp').value;
  const gmp = gmpVal===''? null : parseFloat(gmpVal);
  const notes = document.getElementById('f_notes').value.trim();
  if(!name){ showToast('Please enter an IPO name'); return; }
  if(price<=0){ showToast('Price per share must be greater than 0'); return; }
  if(lot<=0){ showToast('Shares per lot must be greater than 0'); return; }
  if(gmp!=null && isNaN(gmp)){ showToast('Enter a valid GMP or leave it blank'); return; }
  if(allot && listing && allot > listing){ showToast('Listing date should not be before the allotment date'); return; }
  if(ipoId){
    const ipo = state.ipos.find(i=>i.id===ipoId);
    Object.assign(ipo, {name, pricePerShare:price, lotSize:lot, biddingDates:tempBiddingDates.slice(), allotmentDate:allot, listingDate:listing, gmp, notes});
  } else {
    state.ipos.push({id:uid(), name, pricePerShare:price, lotSize:lot, biddingDates:tempBiddingDates.slice(), allotmentDate:allot, listingDate:listing, gmp, notes, listingPrice:null, archived:false});
  }
  saveState(); closeModal(); render(); showToast('IPO saved');
}
