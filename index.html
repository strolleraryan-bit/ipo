    <div class="helptext" style="margin-top:2px;">Commission: full cost from Account A, user earns % of profit. Assisted: both invest their own real stake (Aryan from A, user from B), each principal returns to its own account, profit split by commission % (not ratio). Shared: both invest, profit split by invested ratio.</div>

    <div id="profitShareSection">
      <label>Profit Sharing</label>
      <div class="toggle-row" id="modeToggle">
        <button type="button" class="toggle-btn ${initMode==='commission'?'active':''}" data-mode="commission" onclick="setProfitModeUI('commission')">Commission</button>
        <button type="button" class="toggle-btn ${initMode==='assisted'?'active':''}" data-mode="assisted" onclick="setProfitModeUI('assisted')">Assisted</button>
        <button type="button" class="toggle-btn ${initMode==='shared'?'active':''}" data-mode="shared" onclick="setProfitModeUI('shared')">Shared</button>
      </div>

      <div id="commissionFields">
        <div class="helptext" style="margin-top:10px;">All profit belongs to Aryan. The user earns a commission % of the profit as their cut. Full applied cost is drawn from their Account A.</div>
        <label>Commission % (of profit, goes to user)</label>
        <input type="number" class="mono" id="f_comm" value="${app && app.commissionPercent!=null? app.commissionPercent : ''}" placeholder="Use user default">
      </div>

      <div id="assistedFields">
        <div class="helptext" style="margin-top:10px;">Both invest their own real stake — Aryan's from Account A, user's from Account B — and each principal returns to its own account exactly as invested regardless of outcome. Only the PROFIT is split differently from Shared mode: by a flat commission %, not by the invested ratio.</div>
        <div class="field-row">
          <div><label>Aryan's Invested Amount (₹)</label><input type="number" class="mono" id="f_assistedAryanInv" value="${app && app.profitMode==='assisted'? (app.fundedByMe||0) : ''}" placeholder="0"></div>
          <div><label>User's Invested Amount (₹) — Account B</label><input type="number" class="mono" id="f_userInv" value="${app && app.profitMode==='assisted'? (app.userInvested||0) : ''}" placeholder="0"></div>
        </div>
        <label>Commission % (of profit, goes to user's Account B)</label>
        <input type="number" class="mono" id="f_comm_assisted" value="${app && app.commissionPercent!=null? app.commissionPercent : ''}" placeholder="Use user default">
      </div>

      <div id="sharedFields">
        <div class="helptext" style="margin-top:10px;">Both invest. Profit is split automatically by each party's invested-amount ratio.</div>
        <div class="field-row">
          <div><label>Aryan's Invested Amount (₹)</label><input type="number" class="mono" id="f_aryanInv" value="${app && app.profitMode==='shared'? (app.fundedByMe||0) : ''}" placeholder="0"></div>
          <div><label>User's Invested Amount (₹) — Account B</label><input type="number" class="mono" id="f_sharedUserInv" value="" placeholder="0"></div>
        </div>
        <label>Bonus to User Above Ratio Split (₹) — optional</label>
        <input type="number" class="mono" id="f_bonus" value="${app && app.bonusToUser? app.bonusToUser : ''}" placeholder="0">
        <div class="helptext">If Aryan wants to voluntarily give the user extra profit beyond their invested-ratio share, enter that amount here — it shifts from Aryan's share to the user's.</div>
      </div>

    </div>
    <div class="helptext" id="selfNote" style="display:none;">Applying for yourself — the full amount is yours and all profit/loss is realized directly, no profit-sharing needed.</div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveApp('${appId||''}', '${ipoId}')">Save</button>
    </div>
  `);
  let currentMode = initMode;
  window._appModalMode = initMode; // expose to saveApp (let is closure-scoped, saveApp can't reach it)
  const userSel = document.getElementById('f_user');
  const lotsInput = document.getElementById('f_lots');
  const shareSection = document.getElementById('profitShareSection');
  const selfNote = document.getElementById('selfNote');
  const commWrap = document.getElementById('commissionFields');
  const assistedWrap = document.getElementById('assistedFields');
  const sharedWrap = document.getElementById('sharedFields');
  const aryanInvInput = document.getElementById('f_aryanInv');
  const sharedUserInvInput = document.getElementById('f_sharedUserInv');
  const assistedAryanInvInput = document.getElementById('f_assistedAryanInv');
  const assistedUserInvInput = document.getElementById('f_userInv');
  let lastEdited = 'aryan';
  let assistedLastEdited = 'aryan';

  const cost = () => (parseInt(lotsInput.value)||0) * (ipo.lotSize||0) * (ipo.pricePerShare||0);
  const selectedIsMe = () => { const u = state.users.find(x=>x.id===userSel.value); return !!(u && u.isMe); };

  window.setProfitModeUI = (mode)=>{
    currentMode = mode;
    window._appModalMode = mode;
    document.querySelectorAll('#modeToggle .toggle-btn').forEach(b=>b.classList.toggle('active', b.dataset.mode===mode));
    applyModeRules();
    if(typeof updateBalPreview==='function') updateBalPreview();
  };

  const applyModeRules = ()=>{
    const total = cost();
    if(selectedIsMe()){
      shareSection.style.display = 'none';
      selfNote.style.display = '';
      return;
    }
    shareSection.style.display = '';
    selfNote.style.display = 'none';
    commWrap.style.display = currentMode==='commission' ? '' : 'none';
    assistedWrap.style.display = currentMode==='assisted' ? '' : 'none';
    sharedWrap.style.display = currentMode==='shared' ? '' : 'none';
    if(currentMode==='shared'){
      if(aryanInvInput.value===''){ aryanInvInput.value = Math.round(total/2); }
      if(sharedUserInvInput) sharedUserInvInput.value = clamp0(total - (parseFloat(aryanInvInput.value)||0));
    } else if(currentMode==='assisted'){
      if(assistedAryanInvInput.value===''){ assistedAryanInvInput.value = Math.round(total/2); }
      if(assistedUserInvInput) assistedUserInvInput.value = clamp0(total - (parseFloat(assistedAryanInvInput.value)||0));
    }
  };

  const updatePreview = ()=>{
    const total = cost();
    document.getElementById('costPreview').textContent = `Total applied amount: ${fmtMoney(total)} (${parseInt(lotsInput.value)||0} × ${ipo.lotSize||0} × ${fmtMoney(ipo.pricePerShare)})`;
    if(currentMode==='shared' && !selectedIsMe()){
      if(lastEdited==='user'){
        aryanInvInput.value = clamp0(total - (parseFloat((sharedUserInvInput||{}).value)||0));
      } else {
        if(sharedUserInvInput) sharedUserInvInput.value = clamp0(total - (parseFloat(aryanInvInput.value)||0));
      }
    } else if(currentMode==='assisted' && !selectedIsMe()){
      if(assistedLastEdited==='user'){
        assistedAryanInvInput.value = clamp0(total - (parseFloat((assistedUserInvInput||{}).value)||0));
      } else {
        if(assistedUserInvInput) assistedUserInvInput.value = clamp0(total - (parseFloat(assistedAryanInvInput.value)||0));
      }
    }
  };
  const updateBalPreview = ()=>{
    const el = document.getElementById('userBalPreview'); if(!el) return;
    const uid = userSel.value;
    const u = state.users.find(x=>x.id===uid);
    if(!u){ el.style.display='none'; return; }
    const excludeId = app ? app.id : null;
    if(u.isMe){
      const bal = myAccountBalance();
      el.style.cssText = `margin-top:4px;font-size:13px;padding:6px 10px;border-radius:8px;background:rgba(74,222,128,0.07);color:var(--text-muted);display:block;`;
      el.textContent = `Your tracked balance: ${fmtMoney(bal)}`;
      return;
    }
    const total = cost();
    const reqA = currentMode==='commission' ? total
               : currentMode==='assisted' ? clamp0(parseFloat(assistedAryanInvInput.value)||0)
               : clamp0(parseFloat(aryanInvInput.value)||0);
    const reqB = currentMode==='shared' ? clamp0(total - clamp0(parseFloat((aryanInvInput||{}).value)||0))
               : currentMode==='assisted' ? clamp0(parseFloat((assistedUserInvInput||{}).value)||0)
               : 0;
    const availA = accountABalance(uid, excludeId);
    const availB = accountBBalance(uid, excludeId);
    const okA = reqA<=0.005 || availA >= reqA-0.005;
    const okB = reqB<=0.005 || availB >= reqB-0.005;
    const ok = okA && okB;
    el.style.cssText = `margin-top:4px;font-size:13px;padding:6px 10px;border-radius:8px;background:${ok?'rgba(74,222,128,0.1)':'rgba(248,113,113,0.12)'};color:${ok?'var(--profit)':'var(--loss)'};display:block;`;
    let msg = `${ok?'✓':'⚠️'} ${u.name}'s Account A: ${fmtMoney(availA)}`;
    if(reqA>0.005) msg += ` (needs ${fmtMoney(reqA)})`;
    if(currentMode==='shared' || currentMode==='assisted'){
      msg += ` · Account B: ${fmtMoney(availB)}`;
      if(reqB>0.005) msg += ` (needs ${fmtMoney(reqB)})`;
    }
    if(!ok) msg += ' — insufficient, add funds first';
    el.textContent = msg;
  };
  lotsInput.addEventListener('input', ()=>{ updatePreview(); updateBalPreview(); });
  aryanInvInput.addEventListener('input', ()=>{
    lastEdited = 'aryan';
    const total = cost();
    if(sharedUserInvInput) sharedUserInvInput.value = clamp0(total - (parseFloat(aryanInvInput.value)||0));
    updateBalPreview();
  });
  if(sharedUserInvInput) sharedUserInvInput.addEventListener('input', ()=>{
    lastEdited = 'user';
    const total = cost();
    aryanInvInput.value = clamp0(total - (parseFloat(sharedUserInvInput.value)||0));
    updateBalPreview();
  });
  if(assistedAryanInvInput) assistedAryanInvInput.addEventListener('input', ()=>{
    assistedLastEdited = 'aryan';
    const total = cost();
    if(assistedUserInvInput) assistedUserInvInput.value = clamp0(total - (parseFloat(assistedAryanInvInput.value)||0));
    updateBalPreview();
  });
  if(assistedUserInvInput) assistedUserInvInput.addEventListener('input', ()=>{
    assistedLastEdited = 'user';
    const total = cost();
    if(assistedAryanInvInput) assistedAryanInvInput.value = clamp0(total - (parseFloat(assistedUserInvInput.value)||0));
    updateBalPreview();
  });
  userSel.addEventListener('change', ()=>{ applyModeRules(); updateBalPreview(); });
  updateBalPreview();

  // Pre-fill investment amounts on edit
  if(app && app.profitMode==='shared'){
    if(sharedUserInvInput) sharedUserInvInput.value = clamp0(totalCost(app, ipo) - (app.fundedByMe||0));
  }
  if(app && app.profitMode==='assisted'){
    if(assistedUserInvInput) assistedUserInvInput.value = clamp0(totalCost(app, ipo) - (app.fundedByMe||0));
  }

  updatePreview();
  applyModeRules();
}
function saveApp(appId, ipoId){
  const ipo = state.ipos.find(i=>i.id===ipoId);
  const userId = document.getElementById('f_user').value;
  const user = state.users.find(u=>u.id===userId);
  const lots = parseInt(document.getElementById('f_lots').value)||0;
  if(!userId){ showToast('Select a user'); return; }
  if(lots<=0){ showToast('Enter number of lots'); return; }
  if(!ipo.lotSize || !ipo.pricePerShare){ showToast('Set the IPO price and lot size first'); return; }
  const cost = lots * (ipo.lotSize||0) * (ipo.pricePerShare||0);

  let funded, amountGiven, commission = null, profitMode = 'commission', bonusToUser = 0;
  if(user && user.isMe){
    funded = cost;
    amountGiven = cost;
  } else {
    profitMode = (window._appModalMode) ? window._appModalMode : 'commission';
    if(profitMode==='commission'){
      funded = cost;
      const commVal = document.getElementById('f_comm').value;
      commission = commVal===''? null : parseFloat(commVal);
      if(commission!=null && (isNaN(commission) || commission<0 || commission>100)){
        showToast('Commission % must be between 0 and 100'); return;
      }
    } else if(profitMode==='assisted'){
      // Assisted: like Shared, both invest their own real stake — Aryan's from Account A, user's
      // from Account B — and each principal returns to its own account exactly as invested. Unlike
      // Shared, PROFIT is split by a flat commission % instead of the invested-amount ratio.
      funded = clamp0(parseFloat(document.getElementById('f_assistedAryanInv').value)||0);
      if(funded > cost) funded = cost;
      const commVal = document.getElementById('f_comm_assisted').value;
      commission = commVal===''? null : parseFloat(commVal);
      if(commission!=null && (isNaN(commission) || commission<0 || commission>100)){
        showToast('Commission % must be between 0 and 100'); return;
      }
      // userInvested (= cost - funded, synced in the modal) is saved separately on the application object
    } else {
      funded = clamp0(parseFloat(document.getElementById('f_aryanInv').value)||0);
      if(funded > cost) funded = cost;
      bonusToUser = clamp0(parseFloat(document.getElementById('f_bonus').value)||0);
    }
    // "Amount Actually Given" (extra cash handed over beyond what was applied) was removed as a manual
    // field — it kept auto-filling with the same value as `funded` in practice and was never actually
    // used to record a genuinely different amount, so it was pure friction. amountGiven now always equals
    // funded (extraGiven works out to 0 via computeApp's own clamp0(given-funded) — no behavior change for
    // any existing record, since old records already stored amountGiven==fundedByMe in every real case).
    amountGiven = funded;
  }

  // Balance check — new applicants always; edits only while the application is still pending (not yet
  // allotted or marked not-allotted), since that's the only point real money is actively being committed.
  // For a non-Aryan user this is now checked against their actual Account A / Account B wallet balances
  // (Account A covers Aryan's share, Account B covers the user's own share in Shared Investment mode) —
  // never allow an application to be added/kept if the relevant account(s) can't actually cover it.
  const existingAppForCheck = appId ? state.applications.find(x=>x.id===appId) : null;
  const isPendingEdit = !!existingAppForCheck && existingAppForCheck.allotted!==true && existingAppForCheck.allotted!==false;
  if(!appId || isPendingEdit){
    if(user && user.isMe){
      // No balance check for Aryan — he manages funds physically and can apply even with a negative tracked balance.
    } else if(user){
      const excludeId = appId || null;
      const reqA = (profitMode==='commission') ? cost : funded;
      const reqB = (profitMode==='shared' || profitMode==='assisted') ? clamp0(cost - funded) : 0;
      const availA = accountABalance(userId, excludeId);
      const availB = accountBBalance(userId, excludeId);
      // Tolerance matches fmtMoney's whole-rupee rounding shown in the error message and the balance
      // preview elsewhere in the app — see the identical comment in saveMove()/saveWithdraw().
      if(reqA > 0.5 && reqA > availA + 0.5){
        showToast(`⚠️ ${user.name}'s Account A balance (${fmtMoney(availA)}) can't cover Aryan's share (${fmtMoney(reqA)}). Transfer money into Account A first.`, 5500);
        return;
      }
      if(reqB > 0.5 && reqB > availB + 0.5){
        showToast(`⚠️ ${user.name}'s Account B balance (${fmtMoney(availB)}) can't cover their share (${fmtMoney(reqB)}). Add cash to Account B first.`, 5500);
        return;
      }
    }
  }

  if(appId){
    const a = state.applications.find(x=>x.id===appId);
    const lotsAllottedEl = document.getElementById('f_lotsAllotted');
    let lotsAllotted = lotsAllottedEl ? (parseInt(lotsAllottedEl.value)||null) : a.lotsAllotted;
    if(lotsAllotted!=null){
      if(lotsAllotted<0) lotsAllotted = 0;
      if(lotsAllotted>lots) lotsAllotted = lots; // can't allot more than what was applied for
    }
    const userInvested = profitMode==='assisted' ? clamp0(cost - funded) : undefined;
    Object.assign(a, {lots, fundedByMe:funded, amountGiven, commissionPercent:commission, profitMode, bonusToUser, fundingSource:undefined, lotsAllotted,
      sharedSplitBy:undefined,
      ...(profitMode==='assisted' ? {userInvested} : {userInvested:undefined})});
  } else {
    const userInvested = profitMode==='assisted' ? clamp0(cost - funded) : undefined;
    state.applications.push({id:uid(), ipoId, userId, lots, fundedByMe:funded, amountGiven, allotted:null, lotsAllotted:null, sellPrice:null,
      commissionPercent:commission, profitMode, bonusToUser,
      ...(profitMode==='assisted' ? {userInvested} : {})});
  }
  saveState(); closeModal(); render(); showToast('Applicant saved');
}

  openModal(`

    <label>Actual Sell Price per Share</label>
    <input type="number" class="mono" id="f_sell" value="${ipo.listingPrice!=null?ipo.listingPrice:''}" placeholder="0">
    <div class="helptext">Defaults to the IPO listing price — edit if this applicant sold at a different price.</div>

function saveUser(userId){
  const name = document.getElementById('f_uname').value.trim();
  const commEl = document.getElementById('f_ucomm');
  const comm = commEl ? parseFloat(commEl.value) : null;
  const opening = parseFloat(document.getElementById('f_uopen').value)||0;
  const pan = (document.getElementById('f_upan').value||'').trim().toUpperCase() || null;
  const tpin = (document.getElementById('f_utpin').value||'').trim() || null;
  if(!name){ showToast('Enter a name'); return; }
  if(pan && !/^[A-Z]{5}[0-9]{4}[A-Z]$/.test(pan)){ showToast('PAN format: ABCDE1234F'); return; }
  if(userId){
    const u = state.users.find(x=>x.id===userId);
    if(!u.isMe){ u.name = name; u.defaultCommission = isNaN(comm)?25:comm; }
    u.openingBalance = opening;
    u.pan = pan; u.tpin = tpin;
  } else {
    state.users.push({id:uid(), name, isMe:false, defaultCommission:isNaN(comm)?25:comm, openingBalance:opening, pan, tpin});
  }
  saveState(); closeModal(); render(); showToast('User saved');
}
function deleteUser(userId){
  const bal = userBalance(userId);
  let msg = 'Delete this user? Their applications and transfers will also be removed.';
  if(Math.abs(bal.net) > 0.5){
    msg = bal.net>0
      ? `${state.users.find(u=>u.id===userId)?.name||'This user'} still owes you ${fmtMoney(bal.net)}. Deleting removes that record permanently. Continue?`
      : `You still owe ${state.users.find(u=>u.id===userId)?.name||'this user'} ${fmtMoney(-bal.net)}. Deleting removes that record permanently. Continue?`;
  }
  confirmAction(msg, ()=>{
    state.users = state.users.filter(u=>u.id!==userId);
    state.applications = state.applications.filter(a=>a.userId!==userId);
    state.transactions = state.transactions.filter(t=>t.fromUserId!==userId && t.toUserId!==userId);
    state.withdrawals = (state.withdrawals||[]).filter(w=>w.userId!==userId);
    state.deposits = (state.deposits||[]).filter(d=>d.userId!==userId);
    saveState(); closeModal(); userDetailId=null; render(); showToast('User deleted');
  });
}

function openTxnModal(defaultToUserId, txnId, prefill){
  const existing = txnId ? state.transactions.find(t=>t.id===txnId) : null;
  editingTxnId = txnId || null;
  const me = state.users.find(u=>u.isMe);
  let fromId, toId, amount = '', date = todayISO(), note = '';
  if(existing){ fromId=existing.fromUserId; toId=existing.toUserId; amount=existing.amount; date=existing.date; note=existing.note||''; }
  else if(prefill){ fromId=prefill.fromUserId; toId=prefill.toUserId; amount=prefill.amount; note=prefill.note||''; }
  else { fromId = me?me.id:''; toId = defaultToUserId || ''; }

  const opts = (selId) => state.users.map(u=>`<option value="${u.id}" ${u.id===selId?'selected':''}>${esc(u.name)}${u.isMe?' (You)':''}</option>`).join('');
  const existingFromAccount = existing ? (existing.fromAccount||'A') : 'A';

  openModal(`
    <div class="modal-title">${existing? 'Edit Transfer' : 'Log Money Transfer'}</div>
    <div class="helptext" style="margin:0 0 12px;">Use this only for cash movement outside an IPO application — advances, repayments, or settle-ups. Money you fund into an applicant's IPO is already tracked automatically from the Applicant screen.</div>
    <div class="field-row">
      <div><label>From</label><select id="f_from">${opts(fromId)}</select></div>
      <div><label>To</label><select id="f_to">${opts(toId)}</select></div>
    </div>
    <div id="fromAccountRow" style="margin-top:9px; display:none;">
      <label>From Account</label>
      <select id="f_fromAccount">
        <option value="A" ${existingFromAccount==='A'?'selected':''}>Account A (Aryan's money)</option>
        <option value="B" ${existingFromAccount==='B'?'selected':''}>Account B (their own money)</option>
      </select>
    </div>
    <div id="toAccountNote" class="helptext" style="margin-top:4px;"></div>
    <button class="btn btn-ghost btn-sm" style="width:auto; margin-top:9px;" onclick="swapFromTo()">⇅ Swap From / To</button>
    <label>Amount (₹)</label>
    <input type="number" class="mono" id="f_tamt" value="${amount}" placeholder="0">
    <label>Date</label>
    <input type="date" id="f_tdate" value="${date}">
    <label>Note (optional)</label>
    <input type="text" id="f_tnote" value="${esc(note)}" placeholder="e.g. Advance for next IPO">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveTxn()">Save</button>
    </div>
    ${existing? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteTxn('${existing.id}')">Delete Transfer</button>`:''}
  `);

  const fromSel = document.getElementById('f_from');
  const toSel = document.getElementById('f_to');
  const fromAcctRow = document.getElementById('fromAccountRow');
  const fromAcctSel = document.getElementById('f_fromAccount');
  const toAcctNote = document.getElementById('toAccountNote');
  const updateAccountUI = ()=>{
    const fu = state.users.find(x=>x.id===fromSel.value);
    const tu = state.users.find(x=>x.id===toSel.value);
    if(fu && !fu.isMe){
      fromAcctRow.style.display = '';
      if(tu && tu.isMe){ fromAcctSel.value = 'A'; fromAcctSel.disabled = true; }
      else fromAcctSel.disabled = false;
    } else {
      fromAcctRow.style.display = 'none';
    }
    if(tu && !tu.isMe){
      const toAcct = (fu && fu.isMe) ? 'A' : 'B';
      toAcctNote.textContent = `Will be credited to ${esc(tu.name)}'s Account ${toAcct}${toAcct==='A'?' (money from Aryan)':" (treated as their own money)"}.`;
    } else {
      toAcctNote.textContent = (fu && !fu.isMe) ? 'Transfers to Aryan are always pulled from the sender\'s Account A.' : '';
    }
  };
  fromSel.addEventListener('change', updateAccountUI);
  toSel.addEventListener('change', updateAccountUI);
  window._txnUpdateAccountUI = updateAccountUI;
  updateAccountUI();
}
function swapFromTo(){
  const f = document.getElementById('f_from'), t = document.getElementById('f_to');
  const tmp = f.value; f.value = t.value; t.value = tmp;
  if(typeof window._txnUpdateAccountUI==='function') window._txnUpdateAccountUI();
}
function saveTxn(){
  const fromUserId = document.getElementById('f_from').value;
  const toUserId = document.getElementById('f_to').value;
  const amount = parseFloat(document.getElementById('f_tamt').value)||0;
  const date = document.getElementById('f_tdate').value || todayISO();
  const note = document.getElementById('f_tnote').value.trim();
  if(!fromUserId || !toUserId){ showToast('Select both users'); return; }
  if(fromUserId===toUserId){ showToast('From and To must be different'); return; }
  if(amount<=0){ showToast('Enter an amount'); return; }
  const fromUser = state.users.find(u=>u.id===fromUserId);
  const toUser = state.users.find(u=>u.id===toUserId);
  // Every transaction touching a non-Aryan user is tagged with which of their two accounts it moves —
  // Aryan → user always credits Account A; a transfer to Aryan can only be debited from Account A;
  // any other sender's account is whatever they picked (defaults to Account A).
  let fromAccount = null, toAccount = null;
  if(fromUser && !fromUser.isMe){
    const sel = document.getElementById('f_fromAccount');
    fromAccount = sel ? sel.value : 'A';
    if(toUser && toUser.isMe) fromAccount = 'A';
  }
  if(toUser && !toUser.isMe){
    toAccount = (fromUser && fromUser.isMe) ? 'A' : 'B';
  }
  if(editingTxnId){
    const t = state.transactions.find(x=>x.id===editingTxnId);
    Object.assign(t, {fromUserId, toUserId, amount, date, note, fromAccount, toAccount});
  } else {
    state.transactions.push({id:uid(), fromUserId, toUserId, amount, date, note, fromAccount, toAccount});
  }
  editingTxnId = null;
  saveState(); closeModal(); render(); showToast('Transfer saved');
}
function deleteTxn(txnId){
  state.transactions = state.transactions.filter(t=>t.id!==txnId);
  editingTxnId = null;
  saveState(); closeModal(); render(); showToast('Transfer deleted');
}

/* ============================= MOVE BETWEEN MY OWN ACCOUNTS (A <-> B) ============================= */
// Internal move for a single non-Aryan user: same user on both sides of a transaction, just tagged with
// different fromAccount/toAccount. transfersNetAccount() already handles this correctly (it debits the
// account matching fromAccount and credits the one matching toAccount independently), and the overall
// transfersNet() for the user nets to zero since it's their own money moving between their two pockets.
function openMoveModal(userId){
  const u = state.users.find(x=>x.id===userId); if(!u || u.isMe) return;
  const availA = accountABalance(userId), availB = accountBBalance(userId);
  openModal(`
    <div class="modal-title">Move Between ${esc(u.name)}'s Accounts</div>
    <div class="helptext" style="margin:0 0 12px;">Account A: ${fmtMoney(availA)} · Account B: ${fmtMoney(availB)}</div>
    <label>Direction</label>
    <select id="f_moveDir">
      <option value="AtoB">Account A → Account B</option>
      <option value="BtoA">Account B → Account A</option>
    </select>
    <label>Amount (₹)</label>
    <input type="number" class="mono" id="f_moveAmt" value="" placeholder="0">
    <label>Date</label>
    <input type="date" id="f_moveDate" value="${todayISO()}">
    <label>Note (optional)</label>
    <input type="text" id="f_moveNote" value="" placeholder="e.g. Moving profit to own funds">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveMove('${userId}')">Save</button>
    </div>
  `);
}
function saveMove(userId){
  const dir = document.getElementById('f_moveDir').value;
  const amount = parseFloat(document.getElementById('f_moveAmt').value)||0;
  const date = document.getElementById('f_moveDate').value || todayISO();
  const note = document.getElementById('f_moveNote').value.trim();
  if(amount<=0){ showToast('Enter an amount'); return; }
  const fromAccount = dir==='AtoB' ? 'A' : 'B';
  const toAccount = dir==='AtoB' ? 'B' : 'A';
  const avail = fromAccount==='A' ? accountABalance(userId) : accountBBalance(userId);
  // Tolerance matches fmtMoney's whole-rupee rounding: the "Current Balance" preview the person
  // sees is rounded to the nearest rupee, so if they type that exact displayed number it must be
  // accepted even when the underlying float balance is a few paise below it (e.g. a commission
  // percentage produced 4999.50 which displays as ₹5,000 — typing 5000 must not get rejected).
  if(amount > avail + 0.5){
    showToast(`⚠️ Account ${fromAccount} only has ${fmtMoney(avail)} available.`, 5000);
    return;
  }
  state.transactions.push({id:uid(), fromUserId:userId, toUserId:userId, amount, date, note, fromAccount, toAccount, internal:true});
  saveState(); closeModal(); render(); showToast('Moved between accounts');
}

/* ============================= WITHDRAW TO CASH ============================= */
let editingWithdrawId = null;
function openWithdrawModal(userId, withdrawId){
  const user = state.users.find(u=>u.id===userId); if(!user) return;
  const existing = withdrawId ? (state.withdrawals||[]).find(w=>w.id===withdrawId) : null;
  editingWithdrawId = withdrawId || null;
  const existingAccount = existing ? (existing.account||'A') : 'A';
  const amount = existing ? existing.amount : '';
  const date = existing ? existing.date : todayISO();
  const note = existing ? (existing.note||'') : '';
  const acctPicker = !user.isMe ? `
    <label>From Account</label>
    <select id="f_wacct" onchange="updateWithdrawBalPreview('${userId}')">
      <option value="A" ${existingAccount==='A'?'selected':''}>Account A (Aryan's money)</option>
      <option value="B" ${existingAccount==='B'?'selected':''}>Account B (their own money)</option>
    </select>
  ` : '';
  openModal(`
    <div class="modal-title">${existing? 'Edit Withdrawal' : 'Withdraw to Cash'}</div>
    <div class="helptext" style="margin:0 0 12px;">Record money ${user.isMe?'you':esc(user.name)} took out of the tracked account as physical cash. This reduces ${user.isMe?'your':esc(user.name)+"'s"} account balance and does not move money to anyone else.</div>
    ${acctPicker}
    <div class="stat" id="f_wbalStat" style="margin:14px 0;"><div class="label">Current Balance</div><div class="value" id="f_wbalVal"></div></div>
    <label>Amount (₹)</label>
    <input type="number" class="mono" id="f_wamt" value="${amount}" placeholder="0">
    <label>Date</label>
    <input type="date" id="f_wdate" value="${date}">
    <label>Note (optional)</label>
    <input type="text" id="f_wnote" value="${esc(note)}" placeholder="e.g. Cash for personal use">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveWithdraw('${userId}')">Save</button>
    </div>
    ${existing? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteWithdraw('${existing.id}')">Delete Withdrawal</button>`:''}
  `);
  updateWithdrawBalPreview(userId);
}
function updateWithdrawBalPreview(userId){
  const user = state.users.find(u=>u.id===userId); if(!user) return;
  const valEl = document.getElementById('f_wbalVal'); if(!valEl) return;
  let bal;
  if(user.isMe) bal = myAccountBalance();
  else {
    const acctSel = document.getElementById('f_wacct');
    const acct = acctSel ? acctSel.value : 'A';
    bal = acct==='A' ? accountABalance(userId) : accountBBalance(userId);
  }
  valEl.textContent = fmtMoney(bal);
  valEl.className = `value ${bal>=0?'gold':'loss'}`;
}
function saveWithdraw(userId){
  const user = state.users.find(u=>u.id===userId);
  const amount = parseFloat(document.getElementById('f_wamt').value)||0;
  const date = document.getElementById('f_wdate').value || todayISO();
  const note = document.getElementById('f_wnote').value.trim();
  if(amount<=0){ showToast('Enter an amount'); return; }
  const acctSel = document.getElementById('f_wacct');
  const account = (user && !user.isMe) ? (acctSel?acctSel.value:'A') : null;
  if(user && !user.isMe){
    const avail = account==='A' ? accountABalance(userId) : accountBBalance(userId);
    // Same rupee-rounding tolerance as saveMove() — see comment there.
    if(amount > avail + 0.5){
      showToast(`⚠️ Account ${account} only has ${fmtMoney(avail)} available.`, 5000);
      return;
    }
  }
  if(!Array.isArray(state.withdrawals)) state.withdrawals = [];
  if(editingWithdrawId){
    const w = state.withdrawals.find(x=>x.id===editingWithdrawId);
    Object.assign(w, {amount, date, note, account});
  } else {
    state.withdrawals.push({id:uid(), userId, amount, date, note, account});
  }
  editingWithdrawId = null;
  saveState(); closeModal(); render(); showToast('Withdrawal saved');
}
function deleteWithdraw(withdrawId){
  state.withdrawals = (state.withdrawals||[]).filter(w=>w.id!==withdrawId);
  editingWithdrawId = null;
  saveState(); closeModal(); render(); showToast('Withdrawal deleted');
}

/* ============================= ADD CASH TO ACCOUNT ============================= */
// Available for every user now, not just Aryan. For Aryan (isMe) this tops up his single liquid account.
// For any other user it always credits Account B — this is exactly the "add via cash" feature for their
// own money, distinct from Account A which can only ever be funded by a transfer from Aryan.
let editingDepositId = null;
function openDepositModal(userId, depositId){
  const user = state.users.find(u=>u.id===userId); if(!user) return;
  const existing = depositId ? (state.deposits||[]).find(d=>d.id===depositId) : null;
  editingDepositId = depositId || null;
  const bal = user.isMe ? myAccountBalance() : accountBBalance(userId);
  const amount = existing ? existing.amount : '';
  const date = existing ? existing.date : todayISO();
  const note = existing ? (existing.note||'') : '';
  openModal(`
    <div class="modal-title">${existing? 'Edit Deposit' : 'Add Cash to Account'}</div>
    <div class="helptext" style="margin:0 0 12px;">Record cash ${user.isMe?"you're adding into your own tracked account":esc(user.name)+" is adding into their own Account B"} (e.g. topping up from bank or wallet). ${user.isMe? 'Increases your account balance' : "Increases their Account B balance"} and isn't linked to any IPO.</div>
    <div class="stat" style="margin-bottom:14px;"><div class="label">Current Balance</div><div class="value ${bal>=0?'gold':'loss'}">${fmtMoney(bal)}</div></div>
    <label>Amount (₹)</label>
    <input type="number" class="mono" id="f_damt" value="${amount}" placeholder="0">
    <label>Date</label>
    <input type="date" id="f_ddate" value="${date}">
    <label>Note (optional)</label>
    <input type="text" id="f_dnote" value="${esc(note)}" placeholder="e.g. Top-up from bank">
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveDeposit('${userId}')">Save</button>
    </div>
    ${existing? `<button class="btn btn-danger" style="margin-top:10px;" onclick="deleteDeposit('${existing.id}')">Delete Deposit</button>`:''}
  `);
}
function saveDeposit(userId){
  const amount = parseFloat(document.getElementById('f_damt').value)||0;
  const date = document.getElementById('f_ddate').value || todayISO();
  const note = document.getElementById('f_dnote').value.trim();
  if(amount<=0){ showToast('Enter an amount'); return; }
  if(!Array.isArray(state.deposits)) state.deposits = [];
  if(editingDepositId){
    const d = state.deposits.find(x=>x.id===editingDepositId);
    Object.assign(d, {amount, date, note});
  } else {
    state.deposits.push({id:uid(), userId, amount, date, note});
  }
  editingDepositId = null;
  saveState(); closeModal(); render(); showToast('Deposit saved');
}
function deleteDeposit(depositId){
  state.deposits = (state.deposits||[]).filter(d=>d.id!==depositId);
  editingDepositId = null;
  saveState(); closeModal(); render(); showToast('Deposit deleted');
}

/* ============================= INIT ============================= */
loadState();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
